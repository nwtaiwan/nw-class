<script>
  const NW_BASE = (function(){ const p = window.location.pathname.replace(/\/[^/]*$/, '/'); return window.location.origin + p; })();
  let nwManifestUrl = '';
  /* PWA 應用程式名稱與系統名稱設定（settings/system.name）保持一致 */
  function applyManifest(name) {
    const appName = (name || 'NW Class').trim() || 'NW Class';
    const manifest = {
      name: appName, short_name: appName,
      start_url: NW_BASE + "index.html", scope: NW_BASE,
      display: "standalone", orientation: "portrait",
      background_color: "#ffffff", theme_color: "#d32f2f", lang: "zh-Hant",
      icons: [
        { src: NW_BASE + "logo.png", sizes: "192x192", type: "image/png", purpose: "any" },
        { src: NW_BASE + "logo.png", sizes: "512x512", type: "image/png", purpose: "any maskable" }
      ]
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }));
    let link = document.querySelector('link[rel="manifest"]');
    if (!link) { link = document.createElement('link'); link.rel = 'manifest'; document.head.appendChild(link); }
    link.href = url;
    if (nwManifestUrl) URL.revokeObjectURL(nwManifestUrl);
    nwManifestUrl = url;
    const meta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
    if (meta) meta.setAttribute('content', appName);
  }
  applyManifest('NW Class');
</script>

function toLoginEmail(input) {
  const v = String(input || '').trim();
  if (!v) return '';
  if (v.includes('@')) return v.toLowerCase();
  const local = /^[0-9\s\-()+]+$/.test(v) ? v.replace(/\D/g, '') : v.toLowerCase().replace(/[^a-z0-9._-]/g, '');
  return local ? `${local}@${LOGIN_DOMAIN}` : '';
}

function courseTabs(c, checkedIn = false) {
  const list = Array.isArray(c.tabs) ? c.tabs : [];
  const existing = new Map(list.map((t, i) => [t.id, { ...t, order: Number.isFinite(t.order) ? t.order : i }]));
  const mergedDefaults = DEFAULT_TABS.map((t, i) => ({
    ...t,
    ...(existing.get(t.id) || {}),
    order: Number.isFinite(existing.get(t.id)?.order) ? existing.get(t.id).order : (t.order ?? i),
  }));
  const customs = list.filter(t => t && t.id && t.id !== 'settings' && !DEFAULT_TABS.some(base => base.id === t.id));

/* ===== 課程排序（日期時間近至遠） ===== */
function courseSortKey(c) {
  return `${c.date || '9999-99-99'} ${c.startTime || '99:99'}`;
}
function sortCoursesByDate(courses) {
  return courses.slice().sort((a, b) => courseSortKey(a).localeCompare(courseSortKey(b)));
}
function formatDisplayDate(value) {
  const v = String(value || '').trim();
  if (!v) return '未排程';
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const t = new Date(v);
  if (!isNaN(t.getTime())) {
    return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
  }
  return v.replace(/\//g, '-');
}
function formatDisplayTime(value) {
  const v = String(value || '').trim();
  if (!v) return '';
  const parts = v.split(':');
  if (parts.length >= 2) {
    return `${String(parts[0] || '0').padStart(2, '0')}:${String(parts[1] || '0').padStart(2, '0')}:${String(parts[2] || '0').padStart(2, '0')}`;
  }
  return v;
}
function courseTimeText(c) {
  const s = c.startTime || '', e = c.endTime || '';
  if (s && e) return `${formatDisplayTime(s)}~${formatDisplayTime(e)}`;
  return s ? formatDisplayTime(s) : '';
}

/* ===== 座位（學員端） ===== */
function seatConfigStudent(course) {
  const s = course && course.seat;
  const rows = Math.min(26, Math.max(0, parseInt(s?.rows, 10) || 0));
  const cols = Math.min(99, Math.max(0, parseInt(s?.cols, 10) || 0));
  const aisles = (Array.isArray(s?.aisles) ? s.aisles : [])
    .map(n => parseInt(n, 10))
    .filter(n => Number.isFinite(n) && n >= 1 && n < cols);
  return { rows, cols, aisles: [...new Set(aisles)].sort((a, b) => a - b), allowSelfSelect: s?.allowSelfSelect === true };
}
function seatRowLetter(i) { return String.fromCharCode(65 + i); }
/* 合併「服務指派」與「學員自選」：服務指派優先，回傳 code -> { uid, self } */
function seatOccupancyStudent(course) {
  const staffRaw = course && course.seatAssignments;
  const picksRaw = course && course.seatSelfPicks;
  const staff = (staffRaw && typeof staffRaw === 'object' && !Array.isArray(staffRaw)) ? staffRaw : {};
  const picks = (picksRaw && typeof picksRaw === 'object' && !Array.isArray(picksRaw)) ? picksRaw : {};
  const staffUids = new Set(Object.values(staff));
  const byCode = {};
  Object.entries(staff).forEach(([code, uid]) => { if (uid) byCode[code] = { uid, self: false }; });
  Object.entries(picks).forEach(([uid, code]) => {
    if (!uid || !code || staffUids.has(uid) || byCode[code]) return;
    byCode[code] = { uid, self: true };
  });
  return byCode;
}
function mySeatOf(course) {
  const byCode = seatOccupancyStudent(course);
  const uid = state.currentUser?.uid || '';
  const hit = Object.entries(byCode).find(([, v]) => v.uid === uid);
  return hit ? { code: hit[0], self: hit[1].self } : null;
}

function renderSeatStudent() {
  const box = $('#seat-student-map');
  if (!box) return;
  const c = state.activeCourse || {};
  const { rows, cols, aisles, allowSelfSelect } = seatConfigStudent(c);
  const hint = $('#seat-student-hint');
  const clearBtn = $('#seat-student-clear');
  if (!rows || !cols) {
    if (hint) hint.textContent = '尚未設定座位表';
    if (clearBtn) clearBtn.classList.add('hidden');
    box.innerHTML = '<div class="h-full grid place-items-center"><p class="text-slate-400 text-sm">尚未設定座位表</p></div>';
    return;
  }
  const byCode = seatOccupancyStudent(c);
  const mine = mySeatOf(c);
  const myCode = mine ? mine.code : '';
  // 已有服務指派座位時，不開放自選（避免與指派衝突）
  const canSelfPick = allowSelfSelect && (!mine || mine.self);
  if (hint) {
    hint.textContent = myCode
      ? `我的座位：${myCode}${mine.self ? '（自選）' : ''}`
      : (allowSelfSelect ? '請點選一個空位作為您的座位' : '尚未安排座位');
  }
  if (clearBtn) clearBtn.classList.toggle('hidden', !(mine && mine.self));
  const aisleSet = new Set(aisles);
  let colsTmpl = '2rem';
  for (let c2 = 1; c2 <= cols; c2++) {
    colsTmpl += ' minmax(0, 1fr)';
    if (aisleSet.has(c2)) colsTmpl += ' 1.75rem';
  }
  const gridStyle = `grid-template-columns: ${colsTmpl}; grid-template-rows: auto repeat(${rows}, minmax(2.5rem, 1fr));`;
  const head = ['<div></div>'];
  for (let c2 = 1; c2 <= cols; c2++) {
    head.push(`<div class="grid place-items-center text-[12px] text-slate-400 tabular-nums truncate">${String(c2).padStart(2, '0')}</div>`);
    if (aisleSet.has(c2)) head.push('<div></div>');
  }
  const body = Array.from({ length: rows }, (_, i) => rows - 1 - i).map(r => {
    const letter = seatRowLetter(r);
    const cells = [`<div class="grid place-items-center text-[13px] font-semibold text-slate-500">${letter}</div>`];
    for (let c2 = 1; c2 <= cols; c2++) {
      const code = letter + String(c2).padStart(2, '0');
      const entry = byCode[code];
      const isMine = !!(entry && entry.uid === state.currentUser?.uid);
      if (isMine) {
        cells.push(`<div class="min-w-0 h-full rounded-md border border-brand bg-brand text-white grid place-items-center text-[12px] font-semibold tabular-nums overflow-hidden">${code}</div>`);
      } else if (entry) {

async function pickSeatStudent(code) {
  if (!state.activeCourse || !state.currentUser || state.seatBusy) return;
  const courseId = state.activeCourse.id;
  const uid = state.currentUser.uid;
  const mine = mySeatOf(state.activeCourse);
  if (mine && mine.code === code) { await clearSeatStudent(); return; }
  state.seatBusy = true;
  try {
    await runTransaction(db, async (tx) => {
      const ref = doc(db, 'courses', courseId);
      const snap = await tx.get(ref);
      if (!snap.exists()) throw new Error('課程不存在');
      const data = snap.data() || {};
      if (!(data.seat && data.seat.allowSelfSelect === true)) throw new Error('尚未開放自選座位');
      const staff = (data.seatAssignments && typeof data.seatAssignments === 'object') ? data.seatAssignments : {};
      const picks = (data.seatSelfPicks && typeof data.seatSelfPicks === 'object') ? data.seatSelfPicks : {};
      if (Object.values(staff).includes(uid)) throw new Error('座位已由服務人員安排');
      if (staff[code] && staff[code] !== uid) throw new Error('此座位已被佔用');
      if (Object.entries(picks).some(([u, c]) => c === code && u !== uid)) throw new Error('此座位已被佔用');
      tx.update(ref, { ['seatSelfPicks.' + uid]: code });
    });
    const next = { ...(state.activeCourse.seatSelfPicks || {}) };
    next[uid] = code;
    state.activeCourse.seatSelfPicks = next;
    renderSeatStudent();
    toast('已選擇座位 ' + code);
  } catch (err) {
    toast(err?.message || '選擇失敗');
  } finally {
    state.seatBusy = false;
  }
}

      id: String(v.id || ('v' + (i + 1))),
      question: String(v.question || ''),
      type: v.type === 'multi' ? 'multi' : 'single',
      options: (Array.isArray(v.options) ? v.options : [])
        .filter(o => o && (o.text || o.id))
        .map((o, j) => ({ id: String(o.id || ('o' + (j + 1))), text: String(o.text || '') }))
        .filter(o => o.text),

}

function renderVoteStudentCard(v, uid) {
  const resps = state.voteResponses[v.id] || {};

  const voters = Object.values(resps);
  const total = voters.length;
  const counts = {};
  v.options.forEach(o => { counts[o.id] = 0; });
  voters.forEach(r => (r.optionIds || []).forEach(oid => { if (counts[oid] != null) counts[oid] += 1; }));

  const pick = my ? (my.optionIds || []) : (state.voteSelection[v.id] || []);
  const voted = !!my;
  const canVote = v.open && !voted;
  const showCounts = !!v.showResults && (voted || !v.open);

  const optionsHtml = v.options.map(o => {
    const picked = pick.includes(o.id);
    const c = counts[o.id] || 0;

    if (canVote) {
      return `
        <button data-vote-pick="${escHtml(v.id)}" data-vote-option="${escHtml(o.id)}" class="w-full text-left rounded-lg border px-3 py-2.5 flex items-center justify-between gap-2 ${picked ? 'border-brand bg-brand/5' : 'border-slate-200 bg-white'}">

          ${showCounts ? `<span class="shrink-0 text-slate-500 tabular-nums text-xs">${c} 票 · ${pct}%</span>` : ''}
        </div>
      </div>`;
  }).join('');

  let footer = '';
  if (canVote) {
    const empty = !(state.voteSelection[v.id] || []).length;
    footer = `<button data-vote-submit="${escHtml(v.id)}" class="mt-3 w-full py-2.5 rounded-lg bg-brand text-white font-semibold text-sm ${empty ? 'opacity-50' : ''}">送出投票</button>`;
  } else if (voted) {
    footer = '<p class="mt-3 text-xs text-emerald-600 font-semibold text-center">✓ 已投票</p>';
  } else if (!v.open) {
    footer = '<p class="mt-3 text-xs text-slate-400 font-semibold text-center">投票已截止</p>';
  }

  return `
    <div class="rounded-2xl border border-slate-200 p-4">
      <div class="flex items-center gap-2 flex-wrap mb-3">

        <span class="text-[11px] text-slate-400">已有 ${total} 人投票</span>
      </div>
      <p class="font-semibold text-slate-800 break-words mb-3">${escHtml(v.question)}</p>
      <div class="space-y-2">${optionsHtml}</div>

    </div>`;

function courseFileExt(name) {

  return m ? m[1] : '';
}
function courseFileTypeLabel(file) {
  return COURSE_FILE_LABELS[file?.ext] || '檔案';
}
function courseFileSizeText(size) {
  const n = Number(size || 0);
  if (!Number.isFinite(n) || n <= 0) return '—';
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
  return `${(n / 1024 / 1024).toFixed(1)} MB`;
}
function courseFileTimeText(ts) {
  const d = ts?.toDate ? ts.toDate() : (ts ? new Date(ts) : null);
  if (!d || isNaN(d.getTime())) return '';
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
}
function courseFileOrderValue(f) {
  return Number.isFinite(f?.order) ? f.order : (f?.createdAt?.toMillis?.() || 0);
}
function courseFilesOfTab(tabId) {
  return (state.courseFiles || [])
    .filter(f => f.tabId === tabId)
    .slice()
    .sort((a, b) => (courseFileOrderValue(a) - courseFileOrderValue(b))
      || ((b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0)));
}
function canPreviewCourseFile(file) {
  return COURSE_FILE_PREVIEW_EXTS.has(file?.ext);
}
function base64ToBlob(base64, type) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: type || 'application/octet-stream' });
}
async function fetchCourseFileBlob(file) {
  const snap = await getDocs(collection(db, 'courseFiles', file.id, 'chunks'));
  const parts = snap.docs.map(d => d.data()).sort((a, b) => (a.index || 0) - (b.index || 0));
  if (!parts.length) throw new Error('找不到檔案內容');
  return base64ToBlob(parts.map(p => p.base64 || '').join(''), file.contentType);
}
let previewRenderToken = 0;
/* ===== 預覽內容兩指縮放（PWA / 平板手勢無法使用瀏覽器縮放，改以 transform 自製） ===== */
const previewZoom = { scale: 1, tx: 0, ty: 0 };
function applyPreviewZoom() {
  const el = $('#file-preview-zoom'), body = $('#file-preview-body');
  if (!el) return;
  const { scale, tx, ty } = previewZoom;
  el.style.transform = (scale === 1 && !tx && !ty) ? '' : `translate(${tx}px, ${ty}px) scale(${scale})`;
  if (body) body.style.touchAction = scale > 1 ? 'none' : 'pan-x pan-y';
}
function resetPreviewZoom() {
  const body = $('#file-preview-body');
  if (body) { body.scrollTop = 0; body.scrollLeft = 0; }
  previewZoom.scale = 1; previewZoom.tx = 0; previewZoom.ty = 0;
  applyPreviewZoom();
}
function clampPreviewPan() {
  const body = $('#file-preview-body'), el = $('#file-preview-zoom');
  if (!body || !el) return;
  const s = previewZoom.scale;
  const minTx = Math.min(0, body.clientWidth - el.offsetWidth * s);
  const minTy = Math.min(0, body.clientHeight - el.offsetHeight * s);
  previewZoom.tx = Math.max(minTx, Math.min(0, previewZoom.tx));
  previewZoom.ty = Math.max(minTy, Math.min(0, previewZoom.ty));
}
function setupPreviewZoom() {
  const body = $('#file-preview-body');
  if (!body || body.dataset.zoomBound) return;
  body.dataset.zoomBound = '1';
  let mode = '', startDist = 1, startScale = 1, midX = 0, midY = 0, panX = 0, panY = 0;
  let rectLeft = 0, rectTop = 0;
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  body.addEventListener('touchstart', (e) => {
    if (e.touches.length >= 2) {
      const rect = body.getBoundingClientRect();
      rectLeft = rect.left; rectTop = rect.top;
      mode = 'pinch';
      startDist = dist(e.touches[0], e.touches[1]) || 1;
      startScale = previewZoom.scale;
      midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rectLeft;
      midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rectTop;
      /* 將目前原生捲動位移併入 transform，縮放時錨點才不會位移 */
      previewZoom.tx -= body.scrollLeft;
      previewZoom.ty -= body.scrollTop;
      body.scrollLeft = 0; body.scrollTop = 0;
      panX = previewZoom.tx; panY = previewZoom.ty;
    } else if (e.touches.length === 1 && previewZoom.scale > 1) {
      mode = 'pan';
      panX = e.touches[0].clientX - previewZoom.tx;
      panY = e.touches[0].clientY - previewZoom.ty;
    } else {
      mode = '';
    }
  }, { passive: true });
  body.addEventListener('touchmove', (e) => {
    if (mode === 'pinch' && e.touches.length >= 2) {
      e.preventDefault();
      const s = Math.max(1, Math.min(5, startScale * (dist(e.touches[0], e.touches[1]) / startDist)));
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rectLeft;
      const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rectTop;
      previewZoom.tx = cx - (midX - panX) / startScale * s;
      previewZoom.ty = cy - (midY - panY) / startScale * s;
      previewZoom.scale = s;
      clampPreviewPan(); applyPreviewZoom();
    } else if (mode === 'pan' && e.touches.length === 1 && previewZoom.scale > 1) {
      e.preventDefault();
      previewZoom.tx = e.touches[0].clientX - panX;
      previewZoom.ty = e.touches[0].clientY - panY;
      clampPreviewPan(); applyPreviewZoom();
    }
  }, { passive: false });
  body.addEventListener('touchend', (e) => {
    if (e.touches.length >= 2) { mode = 'pinch'; return; }
    if (e.touches.length === 1 && mode === 'pinch') {
      mode = 'pan';
      panX = e.touches[0].clientX - previewZoom.tx;
      panY = e.touches[0].clientY - previewZoom.ty;
      return;
    }
    mode = '';
    if (previewZoom.scale <= 1.02) resetPreviewZoom();
    else { clampPreviewPan(); applyPreviewZoom(); }
  }, { passive: true });
}
function closeCourseFilePreview() {
  previewRenderToken++;
  $('#modal-file-preview')?.classList.add('hidden');

  content.innerHTML = '<div class="h-64 grid place-items-center text-slate-400 text-sm">載入中…</div>';
  const token = ++previewRenderToken;
  try {
    const blob = await fetchCourseFileBlob(file);
    if (token !== previewRenderToken) return;
    await renderCourseFilePreview(body, content, blob, file, token);
  } catch (e) {
    if (token !== previewRenderToken) return;
    content.innerHTML = `<div class="h-64 grid place-items-center text-slate-400 text-sm">預覽失敗：${escHtml(e.message || '')}</div>`;
  }
}
/* PDF 以 pdf.js 繪製為 Canvas，兼容平板／手機（iOS Safari、Android 無法內嵌 blob iframe） */
async function renderPdfPreview(body, content, blob, token) {
  const lib = window.pdfjsLib;
  if (!lib) throw new Error('預覽元件載入失敗');
  const pdf = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
  if (token !== previewRenderToken) return;
  const wrap = document.createElement('div');
  wrap.className = 'p-3 space-y-3 bg-slate-100';
  content.innerHTML = '';
  content.appendChild(wrap);
  const maxWidth = Math.max(240, (body.clientWidth || window.innerWidth) - 24);
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const base = page.getViewport({ scale: 1 });
    const viewport = page.getViewport({ scale: Math.min(2.5, maxWidth / base.width) });
    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    canvas.className = 'block mx-auto max-w-full h-auto bg-white rounded-lg shadow-sm';
    wrap.appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    if (token !== previewRenderToken) return;
  }
}
async function renderCourseFilePreview(body, content, blob, file, token) {
  if (file.ext === 'pdf') {
    await renderPdfPreview(body, content, blob, token);
    return;
  }
  if (file.ext === 'docx') {
    if (!window.mammoth) { content.innerHTML = '<div class="h-64 grid place-items-center text-slate-400 text-sm">預覽元件載入失敗</div>'; return; }
    const { value } = await window.mammoth.convertToHtml({ arrayBuffer: await blob.arrayBuffer() });
    content.innerHTML = `<div class="p-6 bg-white text-sm leading-relaxed text-slate-700">${value || '<p class="text-slate-400">無內容</p>'}</div>`;
    return;
  }
  if (file.ext === 'xls' || file.ext === 'xlsx') {
    if (!window.XLSX) { content.innerHTML = '<div class="h-64 grid place-items-center text-slate-400 text-sm">預覽元件載入失敗</div>'; return; }
    const wb = window.XLSX.read(new Uint8Array(await blob.arrayBuffer()), { type: 'array' });
    content.innerHTML = wb.SheetNames.map(n => `
      <div class="p-4 bg-white border-b border-slate-100">
        <p class="text-xs font-semibold text-slate-500 mb-2">${escHtml(n)}</p>
        <div class="overflow-auto no-scrollbar">${window.XLSX.utils.sheet_to_html(wb.Sheets[n])}</div>
      </div>`).join('');
    return;
  }
  content.innerHTML = '<div class="h-64 grid place-items-center text-center p-6"><div><p class="text-slate-600 font-semibold">此格式不支援線上預覽</p><p class="text-xs text-slate-400 mt-1">請下載後開啟</p></div></div>';
}

/* ===== 圖片壓縮（置中裁切為正方形 JPEG） ===== */
function compressImage(file, maxSize = 256, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('讀取檔案失敗'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('圖片載入失敗'));
      img.onload = () => {
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        const canvas = document.createElement('canvas');
        canvas.width = maxSize; canvas.height = maxSize;
        canvas.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, maxSize, maxSize);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  $('#course-tab-panel').classList.toggle('p-6', tabId !== 'seat');
  $('#course-tab-panel').classList.toggle('checkin-anim', tabId === 'checkin');
  if (tabId !== 'seat') cleanupSeatListener();
  if (tabId === 'checkin') { cleanupVoteListeners(); cleanupBuzzListeners(); cleanupCourseFileListeners(); cleanupActivityListeners(); renderCheckinStudent(); return; }
  if (tabId === 'seat') { cleanupVoteListeners(); cleanupBuzzListeners(); cleanupCourseFileListeners(); cleanupActivityListeners(); openSeatStudent(); return; }
  if (tabId === 'vote') { cleanupBuzzListeners(); cleanupCourseFileListeners(); cleanupActivityListeners(); openVoteStudent(); return; }
  if (tabId === 'qa') { cleanupVoteListeners(); cleanupCourseFileListeners(); cleanupActivityListeners(); openBuzzStudent(); return; }
  if (tabId === 'schedule') { cleanupVoteListeners(); cleanupBuzzListeners(); cleanupCourseFileListeners(); cleanupActivityListeners(); openScheduleStudent(); return; }
  if (tabId === 'download') {
    cleanupVoteListeners();
    cleanupBuzzListeners();
    cleanupCourseFileListeners();
    openActivityStudent();
    return;
  }
  if (tabId === 'handouts') {
    cleanupVoteListeners();
    cleanupBuzzListeners();
    cleanupActivityListeners();
    openCourseFilesStudent(tabId, label);
    return;
  }
  cleanupVoteListeners();
  cleanupBuzzListeners();
  cleanupCourseFileListeners();
  cleanupActivityListeners();
  $('#course-tab-panel').innerHTML = `
    <p class="font-semibold text-slate-700">${escHtml(label)}</p>
    <p class="text-xs text-slate-400 mt-1">內容建置中</p>
    <div class="mt-3 h-32 rounded-xl border border-dashed border-slate-200 bg-slate-50"></div>`;
}
$('#course-buttons').addEventListener('click', (e) => {
  const b = e.target.closest('.course-tab-btn');
  if (!b) return;
  openCourseTab(b.dataset.tab);
});
$('#course-tab-panel').addEventListener('click', (e) => {
  const pick = e.target.closest('[data-vote-pick]');
  if (pick) { pickVoteOption(pick.dataset.votePick, pick.dataset.voteOption); return; }
  const submit = e.target.closest('[data-vote-submit]');
  if (submit) { submitVote(submit.dataset.voteSubmit); return; }
  const buzz = e.target.closest('#buzz-btn');
  if (buzz) { submitBuzz(); return; }
  const preview = e.target.closest('[data-file-preview]');
  if (preview) { openCourseFilePreview(state.courseFiles.find(f => f.id === preview.dataset.filePreview)); return; }
  const download = e.target.closest('[data-file-download]');
  if (download) { triggerCourseFileDownload(state.courseFiles.find(f => f.id === download.dataset.fileDownload)); return; }
});
</script>
</body>
</html>
