<!DOCTYPE html>

<head>

<link rel="icon" type="image/png" sizes="192x192" href="logo.png" />
<link rel="apple-touch-icon" href="logo.png" />

<script>
  const NW_BASE = (function(){ const p = window.location.pathname.replace(/\/[^/]*$/, '/'); return window.location.origin + p; })();
  let nwManifestUrl = '';
  /* PWA 應用程式名稱固定為「西北會議系統」 */
  function applyManifest() {
    const appName = '西北會議系統';
    const manifest = {
      name: appName, short_name: appName,
      start_url: NW_BASE + "index.html", scope: NW_BASE,
      display: "standalone", orientation: "portrait",
      background_color: "#ffffff", theme_color: "#d32f2f", lang: "zh-Hant",
      icons: [
        { src: NW_BASE + "logo.png", sizes: "192x192", type: "image/png", purpose: "any" },
        { src: NW_BASE + "logo.png", sizes: "512x512", type: "image/png", purpose: "any maskable" }
      ]
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }));
    let link = document.querySelector('link[rel="manifest"]');
    if (!link) { link = document.createElement('link'); link.rel = 'manifest'; document.head.appendChild(link); }
    link.href = url;
    if (nwManifestUrl) URL.revokeObjectURL(nwManifestUrl);
    nwManifestUrl = url;
    const meta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
    if (meta) meta.setAttribute('content', appName);
  }
  applyManifest();
</script>

<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: #f1f5f9; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  /* PWA 一頁式：確保外殼撐滿可視高度，頁尾固定可見（100vh 作為不支援 dvh 的後備） */
  #app-shell { height: 100vh; height: 100dvh; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  /* 活動幻燈片：桌機（非觸控）可用滑鼠按住左右拖曳 */
  #activity-student-list { cursor: grab; }
  #activity-student-list, #activity-student-list * { user-select: none; -webkit-user-select: none; }
  #activity-student-list.dragging { cursor: grabbing; scroll-snap-type: none; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to {opacity:1; transform:none;} }
  .fade-in { animation: fadeIn .25s ease-out; }
  /* 上課證背景：緩慢流動的漸層動畫 */
  @keyframes checkinBg {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .checkin-anim {
    background-image: linear-gradient(120deg, #fee2e2, #fecaca, #fef2f2, #fca5a5);
    background-size: 300% 300%;
    animation: checkinBg 14s ease-in-out infinite;
  }
  /* 上課證四角紋飾：呼吸微光動畫（各角錯開延遲，形成環繞流動感） */
  @keyframes cornerGlow {
    0%, 100% { opacity: .45; filter: drop-shadow(0 0 0 rgba(211,47,47,0)); scale: 1; }
    50%      { opacity: 1;   filter: drop-shadow(0 0 7px rgba(211,47,47,.6)); scale: 1.05; }
  }
  .checkin-corner {
    animation: cornerGlow 2.8s ease-in-out infinite;
    transform-origin: center;
  }
  /* 課程卡片：外框線條呼吸光暈動畫，讓卡片更明顯 */
  @keyframes courseCardGlow {
    0%, 100% { border-color: rgba(211,47,47,.35); box-shadow: 0 1px 3px rgba(15,23,42,.08); }
    50%      { border-color: rgba(211,47,47,.9);  box-shadow: 0 4px 14px rgba(211,47,47,.25), 0 0 10px 1px rgba(211,47,47,.3); }
  }
  button.course-card {
    border-width: 2px;
    animation: courseCardGlow 2.6s ease-in-out infinite;
  }
  /* 座位代號：依座位寬度自動縮放，確保文字完整顯示 */
  .seat-cell { container-type: inline-size; }
  .seat-code { font-size: 10px; font-size: clamp(6px, 40cqw, 12px); line-height: 1; }
  /* 座位圖背景：緩慢流動的漸層動畫 */
  .seat-map-anim {
    background-image: linear-gradient(120deg, #f8fafc, #eff6ff, #f1f5f9, #e0e7ff);
    background-size: 300% 300%;
    animation: checkinBg 14s ease-in-out infinite;
  }
  /* 搶答：立體亮面圓形紅色大按鈕 */
  .buzz-btn {
    position: relative;
    display: grid;
    place-items: center;
    width: min(68vw, 280px);
    aspect-ratio: 1 / 1;
    border: none;
    border-radius: 50%;
    color: #fff;
    font-size: clamp(2rem, 12vw, 3rem);
    font-weight: 800;
    text-shadow: 0 3px 8px rgba(110, 0, 0, .5);
    background: radial-gradient(circle at 50% 76%, #b91c1c 0%, #dc2626 40%, #ef4444 68%, #fca5a5 100%);
    box-shadow:
      0 16px 0 #7f1d1d,
      0 24px 36px rgba(127, 29, 29, .45),
      inset 0 -12px 20px rgba(127, 29, 29, .55),
      inset 0 10px 18px rgba(255, 255, 255, .28);
    transition: transform .07s ease, box-shadow .07s ease, filter .25s ease;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    touch-action: manipulation;
  }
  /* 亮面高光 */
  .buzz-btn::after {
    content: '';
    position: absolute;
    left: 15%;
    right: 15%;
    top: 7%;
    height: 34%;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0));
    filter: blur(2px);
    pointer-events: none;
  }
  .buzz-btn:active:not(:disabled) {
    transform: translateY(12px);
    box-shadow:
      0 4px 0 #7f1d1d,
      0 8px 16px rgba(127, 29, 29, .4),
      inset 0 -8px 16px rgba(127, 29, 29, .5),
      inset 0 8px 16px rgba(255, 255, 255, .24);
  }
  .buzz-btn:disabled {
    cursor: default;
    filter: grayscale(.75) brightness(.85);
    box-shadow: 0 8px 0 #475569, 0 12px 20px rgba(15, 23, 42, .25);
  }
  #landscape-lock { display: none; }
  @media (orientation: landscape) and (max-height: 540px) {
    #app-shell { filter: blur(2px); pointer-events: none; }
    #landscape-lock { display: flex !important; position: fixed; inset: 0; z-index: 9999; background: #0f172a; color: #fff; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
  }
  .safe-b { padding-bottom: env(safe-area-inset-bottom); }
  .safe-t { padding-top: env(safe-area-inset-top); }
  #file-preview-body table { border-collapse: collapse; font-size: 12px; }
  #file-preview-body td, #file-preview-body th { border: 1px solid #e2e8f0; padding: 4px 6px; }
  #file-preview-body img { max-width: 100%; }
  /* 圖片燈箱：於 90% 彈窗內完整顯示並置中（可兩指縮放） */
  #file-preview-zoom img.lightbox-img { display: block; margin: 0 auto; width: auto; height: auto; max-width: 100%; max-height: calc(90vh - 5rem); object-fit: contain; }
</style>
</head>

const LOGIN_DOMAIN = 'nwclass.app';
// 輸入代號或手機號碼時，自動補上固定網域成為實際 Firebase 帳號
function toLoginEmail(input) {
  const v = String(input || '').trim();
  if (!v) return '';
  if (v.includes('@')) return v.toLowerCase();
  const local = /^[0-9\s\-()+]+$/.test(v) ? v.replace(/\D/g, '') : v.toLowerCase().replace(/[^a-z0-9._-]/g, '');
  return local ? `${local}@${LOGIN_DOMAIN}` : '';
}

async function handleEmailSubmit(e) {
  e.preventDefault();

  if (!loginEmail) return toast('帳號格式錯誤');
  try { await signInWithEmailAndPassword(auth, loginEmail, password); }
  catch (err) { toast(authErrorText(err)); }
}

function courseTabs(c, checkedIn = false) {
  const list = Array.isArray(c.tabs) ? c.tabs : [];
  const existing = new Map(list.map((t, i) => [t.id, { ...t, order: Number.isFinite(t.order) ? t.order : i }]));
  const mergedDefaults = DEFAULT_TABS.map((t, i) => ({
    ...t,
    ...(existing.get(t.id) || {}),
    order: Number.isFinite(existing.get(t.id)?.order) ? existing.get(t.id).order : (t.order ?? i),
  }));
  const customs = list.filter(t => t && t.id && t.id !== 'settings' && !DEFAULT_TABS.some(base => base.id === t.id));
  return mergedDefaults.concat(customs)
    .map(t => (t.id === 'qa' && t.label === '問答') ? { ...t, label: '搶答' } : t)
    .filter(t => {
      // 「搶答」分頁由服務端「開放搶答」開關控制：開放才顯示，關閉則隱藏

      const v = tabVisibility(t);
      if (v === 'hidden') return false;
      if (v === 'checkin') return !!checkedIn;
      return true;

    .slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
}

/* ===== 課程排序（日期時間近至遠） ===== */
function courseSortKey(c) {
  return `${c.date || '9999-99-99'} ${c.startTime || '99:99'}`;
}
function sortCoursesByDate(courses) {
  return courses.slice().sort((a, b) => courseSortKey(a).localeCompare(courseSortKey(b)));
}
function formatDisplayDate(value) {
  const v = String(value || '').trim();
  if (!v) return '未排程';
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const t = new Date(v);
  if (!isNaN(t.getTime())) {
    return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
  }
  return v.replace(/\//g, '-');
}
function formatDisplayTime(value) {
  const v = String(value || '').trim();
  if (!v) return '';
  const parts = v.split(':');
  if (parts.length >= 2) {
    return `${String(parts[0] || '0').padStart(2, '0')}:${String(parts[1] || '0').padStart(2, '0')}:${String(parts[2] || '0').padStart(2, '0')}`;
  }
  return v;
}
function courseTimeText(c) {
  const s = c.startTime || '', e = c.endTime || '';
  if (s && e) return `${formatDisplayTime(s)}~${formatDisplayTime(e)}`;
  return s ? formatDisplayTime(s) : '';
}
/* 課程日期（含結束時間，未設定時間則以當日 23:59:59 計）後滿 24 小時視為已結束 */
function isCourseOutdated(c) {
  const d = String(c?.date || '').trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return false;
  const parts = String(c?.endTime || c?.startTime || '').trim().split(':');
  const hh = String(parts[0] || '23').padStart(2, '0');
  const mm = String(parts[1] || '59').padStart(2, '0');
  const ss = String(parts[2] || '59').padStart(2, '0');
  const ts = new Date(`${d}T${hh}:${mm}:${ss}`).getTime();
  return !isNaN(ts) && Date.now() > ts + 86400000;
}

/* ===== 選擇課程（學員：僅指派課程；系統管理員：全部課程） ===== */
async function loadCourseSelect() {
  const list = $('#course-select-list');
  const isAdmin = !!(state.userDoc && state.userDoc.role === 'admin');
  const ids = Array.isArray(state.userDoc?.courses) ? state.userDoc.courses : [];
  if (!isAdmin && !ids.length) { list.innerHTML = '<p class="text-slate-400 text-center py-4 text-xs">尚未指派課程，請聯繫管理員</p>'; return; }
  list.innerHTML = '<p class="text-slate-400 text-center py-4 text-xs">載入中…</p>';
  try {
    let rows;
    if (isAdmin) {
      rows = (await getDocs(collection(db, 'courses'))).docs.map(d => ({ id: d.id, ...d.data() }));
    } else {
      const docs = await Promise.all(ids.map(id => getDoc(doc(db, 'courses', id))));
      rows = docs.filter(d => d.exists()).map(d => ({ id: d.id, ...d.data() }));
    }
    rows = sortCoursesByDate(rows).filter(c => c.archived !== true);
    state.courseMap = {};
    rows.forEach(c => { state.courseMap[c.id] = c; });
    if (!rows.length) { list.innerHTML = `<p class="text-slate-400 text-center py-4 text-xs">${isAdmin ? '尚無課程' : '尚未指派課程'}</p>`; return; }
    list.innerHTML = rows.map(c => {
      const old = isCourseOutdated(c);
      return `
      <button data-course-open="${c.id}" class="w-full text-left border rounded-xl px-4 py-5 ${old ? 'bg-slate-100 border-slate-300 active:bg-slate-200/70' : 'course-card bg-white active:bg-slate-50'}">
        <div class="flex items-center justify-between gap-2">
          <div class="min-w-0">
            <p class="font-bold text-lg truncate ${old ? 'text-slate-400' : 'text-slate-900'}">${c.name || '未命名課程'}</p>
            <p class="text-base mt-1 ${old ? 'text-slate-400' : 'text-slate-600'}">${formatDisplayDate(c.date)}</p>
            ${courseTimeText(c) ? `<p class="text-base mt-0.5 ${old ? 'text-slate-400' : 'text-slate-600'}">${courseTimeText(c)}</p>` : ''}
            ${c.location ? `<div class="flex items-center gap-1.5 mt-1">
              <p class="min-w-0 text-sm truncate ${old ? 'text-slate-400' : 'text-slate-500'}">📍 ${escHtml(c.location)}</p>
              <span role="button" tabindex="0" data-map="${escHtml(c.address || c.location)}" class="shrink-0 inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded-md border border-brand text-brand text-xs font-semibold ${old ? 'opacity-60' : ''}">${MAP_ICON}地圖</span>
            </div>` : ''}
            ${c.checkinTime ? `<p class="text-sm mt-1 ${old ? 'text-slate-400' : 'text-slate-500'}">報到時間：${escHtml(formatDisplayTime(c.checkinTime))}</p>` : ''}
          </div>
          <svg class="shrink-0 text-brand" xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 24 24"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
        </div>
      </button>`;
    }).join('');
  } catch { list.innerHTML = '<p class="text-slate-400 text-center py-4 text-xs">載入失敗</p>'; }
}

/* 彈出約 90% 螢幕大小的視窗顯示地點地圖 */
function openLocationMap(query) {
  const q = String(query || '').trim();
  if (!q) return toast('此課程未設定地點');
  const url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
  const w = Math.round((window.screen.availWidth || window.innerWidth) * 0.9);
  const h = Math.round((window.screen.availHeight || window.innerHeight) * 0.9);
  const left = Math.max(0, Math.round(((window.screen.availWidth || window.innerWidth) - w) / 2));
  const top = Math.max(0, Math.round(((window.screen.availHeight || window.innerHeight) - h) / 2));
  const win = window.open(url, 'nw_map_' + Date.now(), `width=${w},height=${h},left=${left},top=${top}`);
  if (!win) window.open(url, '_blank');
}

function watchCourseCheckin() {
  cleanupListener('unsubCourseCheckin');
  state.courseCheckedIn = false;
  if (!state.activeCourse || !state.currentUser) return;
  const q = query(collection(db, 'checkins'),
    where('uid', '==', state.currentUser.uid),
    where('courseId', '==', state.activeCourse.id));
  let firstSnap = true;
  state.unsubCourseCheckin = onSnapshot(q, (snap) => {
    const has = !snap.empty;
    // 首次快照僅記錄狀態，避免「進入課程時已報到」重複播放慶祝動畫
    if (firstSnap) {
      firstSnap = false;
      state.courseCheckedIn = has;
      renderCourseButtons();
      return;
    }
    if (has === state.courseCheckedIn) return;
    const justCheckedIn = has && !state.courseCheckedIn;
    state.courseCheckedIn = has;
    renderCourseButtons();
    if (justCheckedIn) playCheckinCelebration();
  }, () => {});
}

function watchCertTitle() {
  cleanupListener('unsubCertTitle');
  if (!state.activeCourse) return;
  const courseId = state.activeCourse.id;
  state.unsubCertTitle = onSnapshot(doc(db, 'courses', courseId), (snap) => {
    if (!snap.exists()) return;

    const prev = String(state.activeCourse.certTitle || '');
    const data = snap.data();
    state.activeCourse = { id: snap.id, ...data };
    if (String(data.certTitle || '') !== prev) renderCheckinStudent();
  }, () => {});

function renderCheckinQr() {
  const box = $('#checkin-qr');
  if (!box) return;
  const uid = state.currentUser && state.currentUser.uid;
  if (!uid || typeof window.qrcode !== 'function') {
    box.innerHTML = '<p class="text-xs text-slate-400">QR Code 產生失敗</p>';
    return;
  }
  try {
    const qr = window.qrcode(0, 'M');
    qr.addData(JSON.stringify({ uid }));
    qr.make();
    box.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
    // QR Code 圖形始終水平（與垂直）置中
    const svg = box.querySelector('svg');
    if (svg) {
      svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      // 白色底改為透明背景
      const bg = svg.querySelector('rect');
      if (bg) bg.setAttribute('fill', 'transparent');
    }
  } catch {
    box.innerHTML = '<p class="text-xs text-slate-400">QR Code 產生失敗</p>';
  }
}
/* ===== 報到成功：播放慶祝影片 + 語音，結束後自動切到「座位」分頁 ===== */
let _celebrationTimer = null;
function pickBoyVoice(voices) {
  if (!voices || !voices.length) return null;
  const zh = voices.filter(v => /^(zh|cmn)/i.test(v.lang || ''));
  const pool = zh.length ? zh : voices;
  // 優先挑選名稱含男童/男孩/男聲關鍵字的語音
  return pool.find(v => /(child|kid|boy|young|male|童|男)/i.test(v.name || ''))
    || pool.find(v => /zh[-_]TW|zh[-_]HK/i.test(v.lang || ''))
    || pool[0] || null;
}
function speakCheckinCongratulations() {
  try {
    if (!('speechSynthesis' in window)) return;
    const synth = window.speechSynthesis;
    const name = (state.userDoc && state.userDoc.name) || '學員';
    const text = `恭喜${name}完成報到，讓我們來找座位吧！`;
    const speak = () => {
      try {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-TW';
        u.pitch = 1.4;   // 提高音調，模擬男童聲
        u.rate = 1.0;
        const v = pickBoyVoice(synth.getVoices());
        if (v) u.voice = v;
        synth.cancel();
        // cancel 與 speak 之間留間隔，避免部分瀏覽器直接吞掉語音
        setTimeout(() => { try { synth.resume(); synth.speak(u); } catch { /* 忽略 */ } }, 90);
      } catch { /* 忽略 */ }
    };
    if (synth.getVoices().length) speak();
    else {
      // 語音清單尚未載入時，等待 voiceschanged 後再發聲
      let done = false;
      const once = () => { if (done) return; done = true; speak(); };
      try { synth.addEventListener('voiceschanged', once, { once: true }); } catch { /* 忽略 */ }
      setTimeout(once, 500);
    }
  } catch { /* 忽略語音失敗 */ }
}
function playCheckinCelebration() {
  const overlay = $('#modal-celebrate');
  const video = $('#celebrate-video');
  if (!overlay || !video) return;
  const txt = $('#celebrate-text');
  if (txt) txt.textContent = `恭喜${(state.userDoc && state.userDoc.name) || '學員'}完成報到，讓我們來找座位吧！`;
  const actions = $('#celebrate-actions');
  const showActions = () => { if (actions) actions.classList.remove('hidden'); };
  if (actions) actions.classList.add('hidden');
  overlay.classList.remove('hidden');
  // 影片播放結束（或無法播放）→ 顯示「再看一次 / 好的！」按鈕
  video.onended = showActions;
  video.onerror = showActions;
  replayCheckinCelebration();
  // 保險：影片停滯時仍顯示按鈕，避免畫面卡住
  const armSafety = (ms) => { if (_celebrationTimer) clearTimeout(_celebrationTimer); _celebrationTimer = setTimeout(showActions, ms); };
  if (isFinite(video.duration) && video.duration > 0) armSafety(video.duration * 1000 + 1200);
  else {
    armSafety(12000);
    video.addEventListener('loadedmetadata', () => {
      if (actions && !actions.classList.contains('hidden')) return;
      const d = isFinite(video.duration) && video.duration > 0 ? video.duration * 1000 : 8000;
      armSafety(d + 1200);
    }, { once: true });
  }
}
function replayCheckinCelebration() {
  const video = $('#celebrate-video');
  const actions = $('#celebrate-actions');
  if (!video) return;
  if (actions) actions.classList.add('hidden');
  // 重播影片與字幕，並同步重播語音提示音
  speakCheckinCongratulations();
  try { video.currentTime = 0; } catch {}
  const p = video.play();
  if (p && typeof p.catch === 'function') p.catch(() => { if (actions) actions.classList.remove('hidden'); });
  if (_celebrationTimer) { clearTimeout(_celebrationTimer); _celebrationTimer = null; }
}
function goToSeatFromCelebration() {
  stopCheckinCelebration();
  if ($('.course-tab-btn[data-tab="seat"]')) openCourseTab('seat');
}
/* ===== 座位（學員端） ===== */
function seatConfigStudent(course) {
  const s = course && course.seat;
  const rows = Math.min(26, Math.max(0, parseInt(s?.rows, 10) || 0));
  const cols = Math.min(99, Math.max(0, parseInt(s?.cols, 10) || 0));
  const aisles = (Array.isArray(s?.aisles) ? s.aisles : [])
    .map(n => parseInt(n, 10))
    .filter(n => Number.isFinite(n) && n >= 1 && n < cols);
  return { rows, cols, aisles: [...new Set(aisles)].sort((a, b) => a - b), allowSelfSelect: s?.allowSelfSelect === true };
}
function seatRowLetter(i) { return String.fromCharCode(65 + i); }
/* 合併「服務指派」與「學員自選」：服務指派優先，回傳 code -> { uid, self } */
function seatOccupancyStudent(course) {
  const staffRaw = course && course.seatAssignments;
  const picksRaw = course && course.seatSelfPicks;
  const staff = (staffRaw && typeof staffRaw === 'object' && !Array.isArray(staffRaw)) ? staffRaw : {};
  const picks = (picksRaw && typeof picksRaw === 'object' && !Array.isArray(picksRaw)) ? picksRaw : {};
  const staffUids = new Set(Object.values(staff));
  const byCode = {};
  Object.entries(staff).forEach(([code, uid]) => { if (uid) byCode[code] = { uid, self: false }; });
  Object.entries(picks).forEach(([uid, code]) => {
    if (!uid || !code || staffUids.has(uid) || byCode[code]) return;
    byCode[code] = { uid, self: true };
  });
  return byCode;
}
function mySeatOf(course) {
  const byCode = seatOccupancyStudent(course);
  const uid = state.currentUser?.uid || '';
  const hit = Object.entries(byCode).find(([, v]) => v.uid === uid);
  return hit ? { code: hit[0], self: hit[1].self } : null;
}

function renderSeatStudent() {
  const box = $('#seat-student-map');
  if (!box) return;
  const c = state.activeCourse || {};
  const { rows, cols, aisles, allowSelfSelect } = seatConfigStudent(c);
  const hint = $('#seat-student-hint');
  const clearBtn = $('#seat-student-clear');
  if (!rows || !cols) {
    if (hint) hint.textContent = '尚未設定座位表';
    if (clearBtn) clearBtn.classList.add('hidden');
    box.innerHTML = '<div class="h-full grid place-items-center"><p class="text-slate-400 text-sm">尚未設定座位表</p></div>';
    return;
  }
  const byCode = seatOccupancyStudent(c);
  const mine = mySeatOf(c);
  const myCode = mine ? mine.code : '';
  // 已有服務指派座位時，不開放自選（避免與指派衝突）
  const canSelfPick = allowSelfSelect && (!mine || mine.self);
  if (hint) {
    if (myCode) {
      // 座位代號以紅字粗體顯示
      hint.innerHTML = `我的座位：<span class="text-red-600 font-bold">${escHtml(myCode)}</span>${mine.self ? '（自選）' : ''}`;
    } else {
      hint.textContent = allowSelfSelect ? '請點選一個空位作為您的座位' : '尚未安排座位';
    }
  }
  if (clearBtn) clearBtn.classList.toggle('hidden', !(mine && mine.self));
  const aisleSet = new Set(aisles);
  let colsTmpl = '2rem';
  for (let c2 = 1; c2 <= cols; c2++) {
    colsTmpl += ' minmax(0, 1fr)';
    if (aisleSet.has(c2)) colsTmpl += ' min-content';
  }
  const gridStyle = `grid-template-columns: ${colsTmpl}; grid-template-rows: auto repeat(${rows}, auto);`;
  const head = ['<div></div>'];
  for (let c2 = 1; c2 <= cols; c2++) {
    head.push(`<div class="grid place-items-center text-[12px] text-slate-400 tabular-nums truncate">${String(c2).padStart(2, '0')}</div>`);
    if (aisleSet.has(c2)) head.push('<div></div>');
  }
  const body = Array.from({ length: rows }, (_, i) => rows - 1 - i).map(r => {
    const letter = seatRowLetter(r);
    const cells = [`<div class="grid place-items-center text-[13px] font-semibold text-slate-500">${letter}</div>`];
    for (let c2 = 1; c2 <= cols; c2++) {
      const code = letter + String(c2).padStart(2, '0');
      const entry = byCode[code];
      const isMine = !!(entry && entry.uid === state.currentUser?.uid);
      if (isMine) {
        cells.push(`<div class="seat-cell min-w-0 w-full aspect-[2/3] rounded-md border border-brand bg-brand text-white grid place-items-center font-semibold tabular-nums overflow-hidden"><span class="seat-code">${code}</span></div>`);
      } else if (entry) {
        cells.push(`<button type="button" data-seat-info="${code}" class="seat-cell min-w-0 w-full aspect-[2/3] rounded-md border border-orange-300 bg-orange-100 grid place-items-center text-orange-600 tabular-nums overflow-hidden"><span class="seat-code">${code}</span></button>`);
      } else if (canSelfPick) {
        cells.push(`<button type="button" data-seat-pick="${code}" class="seat-cell min-w-0 w-full aspect-[2/3] rounded-md border border-emerald-300 bg-emerald-50 hover:bg-emerald-100 grid place-items-center text-emerald-700 tabular-nums overflow-hidden"><span class="seat-code">${code}</span></button>`);
      } else {
        cells.push(`<div class="seat-cell min-w-0 w-full aspect-[2/3] rounded-md border border-slate-200 bg-slate-50 grid place-items-center text-slate-400 tabular-nums overflow-hidden"><span class="seat-code">${code}</span></div>`);
      }
      if (aisleSet.has(c2)) cells.push('<div class="rounded bg-slate-400 grid place-items-center text-[10px] font-semibold text-white/90 tracking-widest" style="writing-mode:vertical-rl;">走道</div>');
    }
    return cells.join('');
  }).join('');
  box.innerHTML = `
    <div class="h-full flex flex-col min-h-0">
      <div class="flex-1 min-h-0 overflow-auto no-scrollbar">
        <div class="grid gap-1" style="${gridStyle}">${head.join('')}${body}</div>
        <div class="mt-1 h-10 rounded-lg bg-brand text-white grid place-items-center text-sm font-bold tracking-[0.5em]">講台</div>
      </div>
    </div>`;
}
async function requestSeatPick(code) {
  if (!state.activeCourse || !state.currentUser || state.seatBusy) return;
  const ok = await nwConfirm(`是否選擇座位「${code}」？`, '確認選位');
  if (ok) pickSeatStudent(code);
}
async function showSeatOccupant(code) {
  const byCode = seatOccupancyStudent(state.activeCourse);
  const entry = byCode[code];
  if (!entry) { toast('此座位尚無資料'); return; }
  // 優先讀取課程文件內由服務端寫入的 seatInfo（學員無法讀取他人 users 文件）
  const infoMap = (state.activeCourse && state.activeCourse.seatInfo && typeof state.activeCourse.seatInfo === 'object') ? state.activeCourse.seatInfo : {};
  const info = infoMap[entry.uid] || null;
  let name = info?.name || '';
  let community = info?.community || '';
  let title = info?.title || '';
  if (!info) {
    try {
      const snap = await getDoc(doc(db, 'users', entry.uid));
      if (snap.exists()) {
        const u = snap.data() || {};
        name = name || u.name || '';
        community = community || u.community || u.unit || '';
        title = title || u.title || '';
      }
    } catch { /* 權限不足時忽略，僅顯示已知資訊 */ }
  }
  showSeatInfoModal({
    code,
    community: community || '—',
    title: title || '—',
    name: name || '學員'
  });
}
async function pickSeatStudent(code) {
  if (!state.activeCourse || !state.currentUser || state.seatBusy) return;
  const courseId = state.activeCourse.id;
  const uid = state.currentUser.uid;
  const mine = mySeatOf(state.activeCourse);
  if (mine && mine.code === code) { await clearSeatStudent(); return; }
  state.seatBusy = true;
  try {
    await runTransaction(db, async (tx) => {
      const ref = doc(db, 'courses', courseId);
      const snap = await tx.get(ref);
      if (!snap.exists()) throw new Error('課程不存在');
      const data = snap.data() || {};
      if (!(data.seat && data.seat.allowSelfSelect === true)) throw new Error('尚未開放自選座位');
      const staff = (data.seatAssignments && typeof data.seatAssignments === 'object') ? data.seatAssignments : {};
      const picks = (data.seatSelfPicks && typeof data.seatSelfPicks === 'object') ? data.seatSelfPicks : {};
      if (Object.values(staff).includes(uid)) throw new Error('座位已由服務人員安排');
      if (staff[code] && staff[code] !== uid) throw new Error('此座位已被佔用');
      if (Object.entries(picks).some(([u, c]) => c === code && u !== uid)) throw new Error('此座位已被佔用');
      tx.update(ref, { ['seatSelfPicks.' + uid]: code });
    });
    const next = { ...(state.activeCourse.seatSelfPicks || {}) };
    next[uid] = code;
    state.activeCourse.seatSelfPicks = next;
    renderSeatStudent();
    toast('已選擇座位 ' + code);
  } catch (err) {
    toast(err?.message || '選擇失敗');
  } finally {
    state.seatBusy = false;
  }
}
async function clearSeatStudent() {
  if (!state.activeCourse || !state.currentUser || state.seatBusy) return;
  const courseId = state.activeCourse.id;
  const uid = state.currentUser.uid;
  state.seatBusy = true;
  try {
    await updateDoc(doc(db, 'courses', courseId), { ['seatSelfPicks.' + uid]: deleteField() });
    const next = { ...(state.activeCourse.seatSelfPicks || {}) };
    delete next[uid];
    state.activeCourse.seatSelfPicks = next;
    renderSeatStudent();
    toast('已取消座位');
  } catch (err) {
    toast(err?.message || '取消失敗');
  } finally {
    state.seatBusy = false;
  }
}
function showCourse(course) {
  state.activeCourse = course;
  state.activeTabId = null;
  $('#course-view-name').textContent = course.name || '未命名課程';
  $('#course-view-meta').textContent = [formatDisplayDate(course.date), courseTimeText(course)].filter(Boolean).join(' · ');
  renderCourseButtons();
  const firstTab = courseTabs(course, state.courseCheckedIn)[0];
  if (firstTab) openCourseTab(firstTab.id);
  else $('#course-tab-panel').innerHTML = '<p class="text-slate-400 text-sm">請選擇下方功能</p>';
  showView('dashboard');
  watchCourseCheckin();
  watchCourseDoc();
}

/* 監聽課程文件：同步「搶答」分頁顯示與服務端「分頁顯示」設定（即時重繪學員端導覽） */
function watchCourseDoc() {
  cleanupListener('unsubCourseDoc');
  if (!state.activeCourse) return;
  const courseId = state.activeCourse.id;
  let prevBuzzOpen = state.activeCourse.buzzOpen === true;
  let prevTabsSig = tabsSignature(state.activeCourse);
  state.unsubCourseDoc = onSnapshot(doc(db, 'courses', courseId), (snap) => {
    if (!snap.exists()) return;
    if (!state.activeCourse || state.activeCourse.id !== courseId) return;
    const data = snap.data();
    const nextBuzzOpen = data.buzzOpen === true;
    const nextTabsSig = tabsSignature({ id: snap.id, ...data });
    const buzzChanged = nextBuzzOpen !== prevBuzzOpen;
    const tabsChanged = nextTabsSig !== prevTabsSig;
    prevBuzzOpen = nextBuzzOpen;
    prevTabsSig = nextTabsSig;
    state.activeCourse = { id: snap.id, ...data };
    if (!buzzChanged && !tabsChanged) return;
    renderCourseButtons();
    /* 目前所在分頁被隱藏（或搶答關閉）時，自動切換到第一個可用分頁 */
    const available = courseTabs(state.activeCourse, state.courseCheckedIn);
    if (!available.some(t => t.id === state.activeTabId)) {
      if (available[0]) openCourseTab(available[0].id);
      else $('#course-tab-panel').innerHTML = '<p class="text-slate-400 text-sm">請選擇下方功能</p>';
    }
  }, () => {});
}

/* ===== 投票（學員端） ===== */
function normalizeVotes(list) {
  if (!Array.isArray(list)) return [];
  return list
    .filter(v => v && (v.question || (Array.isArray(v.options) && v.options.length)))
    .map((v, i) => ({
      id: String(v.id || ('v' + (i + 1))),
      question: String(v.question || ''),
      type: v.type === 'multi' ? 'multi' : 'single',
      options: (Array.isArray(v.options) ? v.options : [])
        .filter(o => o && (o.text || o.id))
        .map((o, j) => ({ id: String(o.id || ('o' + (j + 1))), text: String(o.text || '') }))
        .filter(o => o.text),
      open: v.open !== false,
      showResults: v.showResults !== false,
    }))
    .filter(v => v.question && v.options.length >= 2);
}
function courseVotes(course) { return normalizeVotes(course?.votes); }

function cleanupVoteListeners() {
  cleanupListener('unsubVotes');
  cleanupListener('unsubVoteCourse');
}

function openVoteStudent() {
  const panel = $('#course-tab-panel');
  panel.innerHTML = `
    <div class="text-left">
      <p class="text-xl font-bold text-slate-700">投票</p>
      <p class="text-lg text-slate-500 mb-3">請選擇你的答案後送出</p>
      <div id="vote-list" class="space-y-3">
        <p class="text-slate-400 text-sm text-center py-4">載入中…</p>
      </div>
    </div>`;
  cleanupVoteListeners();
  state.voteResponses = {};
  state.voteSelection = {};
  if (!state.activeCourse) return;
  const courseId = state.activeCourse.id;
  state.unsubVoteCourse = onSnapshot(doc(db, 'courses', courseId), (snap) => {
    if (!snap.exists()) return;
    state.activeCourse = { id: snap.id, ...snap.data() };
    renderVoteStudent();
  }, () => {});
  state.unsubVotes = onSnapshot(query(collection(db, 'voteResponses'), where('courseId', '==', courseId)), (snap) => {
    const byVote = {};
    snap.docs.forEach(d => {
      const r = d.data();
      const vid = String(r.voteId || '');
      const bucket = byVote[vid] || (byVote[vid] = {});
      bucket[r.uid] = {
        name: r.name || '',
        optionIds: Array.isArray(r.optionIds) ? r.optionIds : (r.optionId ? [r.optionId] : []),
      };
    });
    state.voteResponses = byVote;
    renderVoteStudent();
  }, () => {});
}

function renderVoteStudent() {
  const box = $('#vote-list');
  if (!box || !state.activeCourse) return;
  const votes = courseVotes(state.activeCourse);
  if (!votes.length) { box.innerHTML = '<p class="text-slate-400 text-sm text-center py-4">目前沒有投票</p>'; return; }
  const uid = state.currentUser?.uid || '';
  box.innerHTML = votes.map(v => renderVoteStudentCard(v, uid)).join('');
}

function renderVoteStudentCard(v, uid) {
  const resps = state.voteResponses[v.id] || {};
  const my = resps[uid];
  const voters = Object.values(resps);
  const total = voters.length;
  const counts = {};
  v.options.forEach(o => { counts[o.id] = 0; });
  voters.forEach(r => (r.optionIds || []).forEach(oid => { if (counts[oid] != null) counts[oid] += 1; }));
  const maxCount = Math.max(1, ...Object.values(counts));
  const pick = my ? (my.optionIds || []) : (state.voteSelection[v.id] || []);
  const voted = !!my;
  const canVote = v.open && !voted;
  const showCounts = !!v.showResults && (voted || !v.open);

  const optionsHtml = v.options.map(o => {
    const picked = pick.includes(o.id);
    const c = counts[o.id] || 0;
    const pct = total ? Math.round((c / total) * 100) : 0;
    if (canVote) {
      return `
        <button data-vote-pick="${escHtml(v.id)}" data-vote-option="${escHtml(o.id)}" class="w-full text-left rounded-lg border px-3 py-2.5 flex items-center justify-between gap-2 ${picked ? 'border-brand bg-brand/5' : 'border-slate-200 bg-white'}">
          <span class="truncate text-sm text-slate-700">${escHtml(o.text)}</span>
          <span class="shrink-0 w-5 h-5 rounded-full border grid place-items-center text-[11px] ${picked ? 'border-brand bg-brand text-white' : 'border-slate-300 text-transparent'}">✓</span>
        </button>`;
    }
    return `
      <div class="relative rounded-lg border ${picked ? 'border-brand' : 'border-slate-100'} overflow-hidden">
        ${showCounts ? `<div class="absolute inset-y-0 left-0 bg-brand/10" style="width:${((c / maxCount) * 100).toFixed(1)}%"></div>` : ''}
        <div class="relative flex items-center justify-between gap-2 px-3 py-2">
          <span class="truncate text-sm ${picked ? 'text-brand font-semibold' : 'text-slate-700'}">${escHtml(o.text)}${picked ? '（我的選擇）' : ''}</span>
          ${showCounts ? `<span class="shrink-0 text-slate-500 tabular-nums text-xs">${c} 票 · ${pct}%</span>` : ''}
        </div>
      </div>`;
  }).join('');

  let footer = '';
  if (canVote) {
    const empty = !(state.voteSelection[v.id] || []).length;
    footer = `<button data-vote-submit="${escHtml(v.id)}" class="mt-3 w-full py-2.5 rounded-lg bg-brand text-white font-semibold text-sm ${empty ? 'opacity-50' : ''}">送出投票</button>`;
  } else if (voted) {
    footer = '<p class="mt-3 text-xs text-emerald-600 font-semibold text-center">✓ 已投票</p>';
  } else if (!v.open) {
    footer = '<p class="mt-3 text-xs text-slate-400 font-semibold text-center">投票已截止</p>';
  }

  return `
    <div class="rounded-2xl border border-slate-200 p-4">
      <div class="flex items-center gap-2 flex-wrap mb-3">
        <span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 text-[11px]">${v.type === 'multi' ? '多選' : '單選'}</span>
        ${v.open ? '' : '<span class="px-1.5 py-0.5 rounded bg-slate-200 text-slate-500 text-[11px]">已截止</span>'}
        <span class="text-[11px] text-slate-400">已有 ${total} 人投票</span>
      </div>
      <p class="font-semibold text-slate-800 break-words mb-3">${escHtml(v.question)}</p>
      <div class="space-y-2">${optionsHtml}</div>
      ${footer}
    </div>`;
}

function pickVoteOption(voteId, optionId) {
  const vote = courseVotes(state.activeCourse).find(v => v.id === voteId);
  if (!vote) return;
  const cur = state.voteSelection[voteId] || [];
  if (vote.type === 'multi') {
    state.voteSelection[voteId] = cur.includes(optionId) ? cur.filter(x => x !== optionId) : cur.concat(optionId);
  } else {
    state.voteSelection[voteId] = cur.includes(optionId) ? [] : [optionId];
  }
  renderVoteStudent();
}

async function submitVote(voteId) {
  const vote = courseVotes(state.activeCourse).find(v => v.id === voteId);
  if (!vote) return;
  const optionIds = state.voteSelection[voteId] || [];
  if (!optionIds.length) return toast('請先選擇選項');
  if (!vote.open) return toast('投票已截止');
  const courseId = state.activeCourse.id;
  const uid = state.currentUser.uid;
  try {
    await setDoc(doc(db, 'voteResponses', `${courseId}_${voteId}_${uid}`), {
      courseId, voteId, uid,
      name: state.userDoc?.name || '',
      optionIds,
      votedAt: serverTimestamp(),
    }, { merge: true });
    delete state.voteSelection[voteId];
    toast('投票完成');
  } catch { toast('投票失敗'); }
}

/* ===== 搶答（學員端） ===== */
let _buzzTimer = null;
function clearBuzzTimer() { if (_buzzTimer) { clearInterval(_buzzTimer); _buzzTimer = null; } }
function cleanupBuzzListeners() {
  cleanupListener('unsubBuzzRounds');
  cleanupListener('unsubBuzzCourse');
  clearBuzzTimer();
}

function buzzOpen() { return state.activeCourse?.buzzOpen === true; }
function buzzRound() {
  const r = parseInt(state.activeCourse?.buzzRound, 10);
  return Number.isFinite(r) && r >= 0 ? r : 0;
}
function buzzStartAt() {
  const v = Number(state.activeCourse?.buzzStartAt);
  return Number.isFinite(v) && v > 0 ? v : 0;
}
/* 每回合選取人數（預設 1 位），與服務端設定同步 */
function buzzWinnerCount() {
  const n = parseInt(state.activeCourse?.buzzWinnerCount, 10);
  return Number.isFinite(n) && n > 0 ? Math.min(n, 20) : 1;
}
function buzzTimeMs(ts) {
  const t = ts?.toDate ? ts.toDate() : (ts ? new Date(ts) : null);
  const ms = t && !isNaN(t.getTime()) ? t.getTime() : null;
  return ms === null ? Number.MAX_SAFE_INTEGER : ms;
}
/* 目前回合的搶答紀錄（依搶答時間先後排序） */
function buzzRoundRecords(round = buzzRound()) {
  return state.buzzRounds[String(round)] || [];
}

function openBuzzStudent() {
  const panel = $('#course-tab-panel');
  panel.innerHTML = `
    <div class="h-full flex flex-col text-left">
      <p class="shrink-0 text-xl font-bold text-slate-700">搶答</p>
      <p id="buzz-sub" class="shrink-0 text-lg text-slate-500 mb-2">載入中…</p>
      <div id="buzz-stage" class="flex-1 min-h-0 overflow-auto no-scrollbar flex py-2"></div>
    </div>`;
  cleanupBuzzListeners();
  state.buzzRounds = {};
  if (!state.activeCourse) return;
  const courseId = state.activeCourse.id;
  state.unsubBuzzCourse = onSnapshot(doc(db, 'courses', courseId), (snap) => {
    if (!snap.exists()) return;
    state.activeCourse = { id: snap.id, ...snap.data() };
    renderBuzzStudent();
  }, () => {});
  state.unsubBuzzRounds = onSnapshot(query(collection(db, 'buzzRounds'), where('courseId', '==', courseId)), (snap) => {
    const byRound = {};
    snap.docs.forEach(d => {
      const r = d.data();
      const key = String(r.round);
      (byRound[key] || (byRound[key] = [])).push({
        id: d.id,
        uid: r.uid || '',
        name: r.name || '',
        community: r.community || '',
        title: r.title || '',
        buzzedAt: r.buzzedAt || null,
      });
    });
    Object.values(byRound).forEach(list => list.sort((a, b) => buzzTimeMs(a.buzzedAt) - buzzTimeMs(b.buzzedAt)));
    state.buzzRounds = byRound;
    renderBuzzStudent();
  }, () => {});
}

function renderBuzzStudent() {
  const stage = $('#buzz-stage');
  const sub = $('#buzz-sub');
  if (!stage) return;
  const uid = state.currentUser?.uid || '';
  const records = buzzRoundRecords();
  const winners = records.slice(0, buzzWinnerCount());
  const open = buzzOpen();

  if (records.length) {
    clearBuzzTimer();
    if (sub) sub.textContent = `第 ${buzzRound() + 1} 回合 · 已搶答`;
    const myIndex = winners.findIndex(w => w.uid === uid);
    const mine = myIndex >= 0;
    if (mine) {
      stage.innerHTML = `
        <div class="m-auto w-full max-w-sm rounded-3xl border border-emerald-300 bg-emerald-50 px-6 py-8 text-center shadow-sm">
          <p class="text-sm text-slate-400 mb-1">恭喜</p>
          <p class="text-2xl font-bold break-words text-emerald-600">你搶答成功！</p>
          ${winners.length > 1 ? `<p class="mt-1 text-sm font-semibold text-emerald-700">第 ${myIndex + 1} 位</p>` : ''}
        </div>`;
    } else {
      const names = winners.map(w => escHtml(w.name || '學員')).join('、');
      stage.innerHTML = `
        <div class="m-auto w-full max-w-sm rounded-3xl border border-slate-200 bg-white px-6 py-8 text-center shadow-sm">
          <p class="text-sm text-slate-400 mb-1">本回合搶答成功</p>
          <p class="text-xl font-bold break-words text-brand">${names || '學員'}</p>
        </div>`;
    }
    return;
  }

  if (sub) sub.textContent = open ? `搶答進行中 · 第 ${buzzRound() + 1} 回合` : '搶答已關閉';

  const startAt = buzzStartAt();
  const remain = (open && startAt) ? 3000 - (Date.now() - startAt) : -1;

  if (!open) {
    clearBuzzTimer();
    stage.innerHTML = `<button id="buzz-btn" type="button" class="buzz-btn m-auto" disabled aria-label="搶答">搶答</button>`;
    return;
  }
  if (remain > 0) {
    // 服務端按下「開始」後的倒數：顯示秒數且不可按
    if (!_buzzTimer) _buzzTimer = setInterval(() => {
      if (!document.getElementById('buzz-btn')) { clearBuzzTimer(); return; }
      renderBuzzStudent();
    }, 200);
    stage.innerHTML = `<button id="buzz-btn" type="button" class="buzz-btn m-auto" disabled aria-label="搶答">${Math.ceil(remain / 1000)}</button>`;
    return;
  }
  // 倒數結束（startAt > 0）才可按；尚未按「開始」時僅顯示按鈕但不可按
  clearBuzzTimer();
  const canPick = startAt > 0;
  stage.innerHTML = `<button id="buzz-btn" type="button" class="buzz-btn m-auto" ${canPick ? '' : 'disabled'} aria-label="搶答">搶答</button>`;
}

async function submitBuzz() {
  if (!state.activeCourse || state.buzzSubmitting) return;
  if (!buzzOpen()) return toast('搶答尚未開放');
  const startAt = buzzStartAt();
  if (!startAt || Date.now() - startAt < 3000) return toast('搶答尚未開始');
  const courseId = state.activeCourse.id;
  const round = buzzRound();
  const uid = state.currentUser.uid;
  const ref = doc(db, 'buzzRounds', `${courseId}_${round}_${uid}`);
  state.buzzSubmitting = true;
  const btn = $('#buzz-btn');
  if (btn) btn.disabled = true;
  try {
    let won = false;
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(ref);
      if (snap.exists()) return;
      won = true;
      tx.set(ref, {
        courseId, round, uid,
        name: state.userDoc?.name || '',
        community: state.userDoc?.community || state.userDoc?.unit || '',
        title: state.userDoc?.title || '',
        buzzedAt: serverTimestamp(),
      });
    });
    if (won) toast('搶答成功！', 1800);
    else toast('已搶答過');
  } catch { toast('搶答失敗'); }
  finally {
    state.buzzSubmitting = false;
    renderBuzzStudent();
  }
}

/* ===== 測驗（學員端） ===== */
const EXAM_OPTION_LABELS = 'ABCDEFGH';
function examNormPaper(arr) {
  return (Array.isArray(arr) ? arr : [])
    .map((q, i) => ({
      id: String(q?.id || ('p' + (i + 1))),
      text: String(q?.text || ''),
      options: (Array.isArray(q?.options) ? q.options : [])
        .map((o, j) => ({ id: String(o?.id || ('o' + (j + 1))), text: String(o?.text || '') }))
        .filter(o => o.text),
      answer: String(q?.answer || ''),
    }))
    .filter(q => q.text && q.options.length >= 2 && q.options.some(o => o.id === q.answer));
}
/* 取課程的多科試卷設定（相容尚未遷移的舊版單一 exam） */
function examNormSubject(s, i) {
  const paperA = examNormPaper(s?.papers?.A);
  const legacy = examNormPaper(s?.questions);
  const A = paperA.length ? paperA : legacy;
  if (!A.length) return null;
  const raw = parseInt(s?.passPercent, 10);
  const abOn = s?.abEnabled === true;
  const B = abOn ? examNormPaper(s?.papers?.B) : [];
  return {
    id: String(s?.id || ('sub' + (i + 1))),
    name: String(s?.name || ('科目 ' + (i + 1))),
    passPercent: Number.isFinite(raw) ? Math.min(100, Math.max(0, raw)) : 60,
    abEnabled: abOn && B.length > 0,
    paperA: A,
    paperB: B,
  };
}
function courseExams(course) {
  const hasExams = Array.isArray(course?.exams);
  const list = hasExams ? course.exams : [];
  const out = list.map((s, i) => examNormSubject(s, i)).filter(Boolean);
  if (out.length || hasExams) return out;
  const legacy = course?.exam ? examNormSubject({ ...course.exam, id: 'legacy', name: course.name || '本課程' }, 0) : null;
  return legacy ? [legacy] : [];
}
/* 依學員 uid 穩定分配 A／B 卷（同一人每次進入都拿同一卷） */
function examUidHash(uid) {
  let h = 5381;
  const s = String(uid || '');
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return h;
}
function examPaperFor(cfg, uid) {
  if (!cfg || !cfg.abEnabled) return { key: '', questions: (cfg && cfg.paperA) || [] };
  const key = (examUidHash(uid) % 2 === 0) ? 'A' : 'B';
  return { key, questions: key === 'A' ? cfg.paperA : cfg.paperB };
}
function examQuestions() {
  return (state.examPaper && state.examPaper.questions) || [];
}

  cleanupListener('unsubExamCourse');

  const courseId = state.activeCourse.id;
  state.unsubExamCourse = onSnapshot(doc(db, 'courses', courseId), (snap) => {
    if (!snap.exists()) return;
    if (!state.activeCourse || state.activeCourse.id !== courseId) return;
    state.activeCourse = { id: snap.id, ...snap.data() };
    state.examSubjects = courseExams(state.activeCourse);
    if (state.examSubject) {
      const cur = state.examSubjects.find(s => s.id === state.examSubject.id);
      if (cur) {
        state.examSubject = cur;
        state.examPaper = examPaperFor(cur, state.currentUser && state.currentUser.uid);
      } else {
        state.examSubject = null;
        state.examPaper = null;
        state.examStage = 'list';
      }
    }
    if (state.examStage !== 'quiz') renderExamStudent();
  }, () => {});
  /* 僅查 courseId（等值查詢不需複合索引），再於前端篩選本人各科成績 */
  state.unsubExamResults = onSnapshot(query(collection(db, 'examResults'), where('courseId', '==', courseId)), (snap) => {
    const map = {};
    snap.docs.forEach(d => {
      const data = d.data();
      if (data.uid !== state.currentUser.uid || !data.subjectId) return;
      map[data.subjectId] = { id: d.id, ...data };
    });
    state.examResultsMap = map;
    if (state.examSubject) state.examResult = map[state.examSubject.id] || null;
    if (state.examStage !== 'quiz') renderExamStudent();
  }, () => {});
}

    return;

  if (state.examResult && state.examResult.passed) ensureExamCertificate(state.examResult);

function selectExamOption(qid, oid) {
  state.examAnswers[qid] = oid;
  const group = $(`[data-exam-question="${qid}"]`);
  if (group) {
    group.querySelectorAll('[data-exam-option]').forEach(btn => {
      const on = btn.dataset.examOption === oid;
      btn.classList.toggle('border-brand', on);
      btn.classList.toggle('bg-brand/5', on);
      btn.classList.toggle('border-slate-200', !on);
      btn.classList.toggle('text-slate-900', on);
      const dot = btn.querySelector('[data-exam-dot]');
      if (dot) {
        dot.classList.toggle('bg-brand', on);
        dot.classList.toggle('border-brand', on);
        dot.classList.toggle('text-white', on);
        dot.classList.toggle('border-slate-300', !on);
        dot.classList.toggle('text-slate-500', !on);
      }
    });
  }
  updateExamSubmitState();
}
function updateExamSubmitState() {
  const questions = examQuestions();
  const total = questions.length;
  const answered = questions.filter(q => state.examAnswers[q.id]).length;
  const btn = $('#exam-submit');
  if (!btn) return;
  const done = total > 0 && answered >= total;
  btn.disabled = !done;
  btn.className = `w-full py-3 rounded-xl font-semibold text-white ${done ? 'bg-brand active:scale-[0.98]' : 'bg-slate-300'}`;
  btn.textContent = done ? '送出測驗' : `尚餘 ${total - answered} 題未作答`;
}
async function submitExamQuiz() {
  const sub = state.examSubject;
  const questions = examQuestions();
  if (!sub || !questions.length || !state.activeCourse || !state.currentUser) return;
  const unanswered = questions.filter(q => !state.examAnswers[q.id]);
  if (unanswered.length) return toast(`尚有 ${unanswered.length} 題未作答`);
  const ok = await nwConfirm('送出後將立即計分，確定要送出嗎？', '送出測驗');
  if (!ok) return;
  const score = questions.filter(q => state.examAnswers[q.id] === q.answer).length;
  const total = questions.length;
  const percent = Math.round((score / total) * 100);
  const passed = percent >= sub.passPercent;
  const prev = state.examResult;
  const better = !prev || (Number(prev.percent) || 0) <= percent;
  const u = state.userDoc || {};
  const attempts = (Number(prev?.attempts) || 0) + 1;
  const payload = {
    courseId: state.activeCourse.id,
    subjectId: sub.id,
    subjectName: sub.name,
    uid: state.currentUser.uid,
    name: u.name || '',
    community: u.community || '',
    title: u.title || '',
    paper: (state.examPaper && state.examPaper.key) || '',
    attempts,
    updatedAt: serverTimestamp(),
  };
  if (better) Object.assign(payload, { score, total, percent, passed });
  const docId = `${state.activeCourse.id}_${sub.id}_${state.currentUser.uid}`;
  try {
    await setDoc(doc(db, 'examResults', docId), payload, { merge: true });
    state.examJust = { score, total, percent, passed };
    const merged = better
      ? { ...(prev || {}), ...payload, score, total, percent, passed }
      : { ...(prev || {}), subjectId: sub.id, subjectName: sub.name, attempts };
    state.examResult = merged;
    state.examResultsMap[sub.id] = merged;
    state.examCertUrl = '';
    state.examStage = 'result';
    renderExamStudent();
  } catch (err) {
    toast('送出失敗：' + (err.message || ''), 2600);
  }
}
/* ===== 電子獎狀（Canvas 產生 PNG，零外部相依） ===== */
function examCertFont(size, weight) {
  return `${weight ? weight + ' ' : ''}${size}px "Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif`;
}
function examCertTrim(text, max) {
  const t = String(text || '');
  return t.length > max ? `${t.slice(0, max)}…` : t;
}
function loadImageElement(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('load failed'));
    img.src = src;
  });
}
let examCertToken = 0;
async function buildExamCertificate(result) {
  const W = 1600, H = 1131;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const u = state.userDoc || {};
  const course = state.activeCourse || {};
  const name = examCertTrim(result?.name || u.name || '學員', 12);
  const courseName = examCertTrim(course.name || '本課程', 22);
  const subjectName = examCertTrim((state.examSubject && state.examSubject.name) || '測驗', 22);
  const percent = Number(result?.percent) || 0;
  const passPercent = (state.examSubject && state.examSubject.passPercent) ?? 60;

  ctx.fillStyle = '#fffdf9'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#c81e1e'; ctx.lineWidth = 16; ctx.strokeRect(28, 28, W - 56, H - 56);
  ctx.strokeStyle = 'rgba(200,30,30,0.35)'; ctx.lineWidth = 3; ctx.strokeRect(58, 58, W - 116, H - 116);
  ctx.fillStyle = '#c81e1e';
  [[28, 28], [W - 28, 28], [28, H - 28], [W - 28, H - 28]].forEach(([x, y]) => {
    ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2); ctx.fill();
  });

  try { const logo = await loadImageElement('logo.png'); ctx.drawImage(logo, W / 2 - 52, 96, 104, 104); } catch {}

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#c81e1e';
  ctx.font = examCertFont(104, '700');
  ctx.fillText('獎　狀', W / 2, 300);
  ctx.strokeStyle = 'rgba(200,30,30,0.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W / 2 - 260, 336); ctx.lineTo(W / 2 + 260, 336); ctx.stroke();
  ctx.fillStyle = '#94a3b8';
  ctx.font = examCertFont(26, '400');
  ctx.fillText('ELECTRONIC CERTIFICATE', W / 2, 378);

  ctx.fillStyle = '#1e293b';
  ctx.font = examCertFont(78, '700');
  ctx.fillText(name, W / 2, 492);

  const sub = [u.community, u.title].filter(Boolean).join(' · ');
  if (sub) {
    ctx.fillStyle = '#64748b';
    ctx.font = examCertFont(34, '400');
    ctx.fillText(examCertTrim(sub, 30), W / 2, 548);
  }

  ctx.fillStyle = '#334155';
  ctx.font = examCertFont(36, '400');
  ctx.fillText(`完成《${courseName}》`, W / 2, 620);
  ctx.fillText(`「${subjectName}」測驗`, W / 2, 676);
  ctx.fillText(`成績 ${percent} 分（合格門檻 ${passPercent} 分），`, W / 2, 732);
  ctx.fillText('特頒此狀，以資鼓勵。', W / 2, 788);

  ctx.strokeStyle = 'rgba(148,163,184,0.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(200, 880); ctx.lineTo(W - 200, 880); ctx.stroke();

  const d = new Date();
  const dateText = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#475569';
  ctx.font = examCertFont(30, '400');
  ctx.fillText(`頒發日期：${dateText}`, 200, 948);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#0f172a';
  ctx.font = examCertFont(30, '600');
  ctx.fillText(state.systemName || '西北會議系統', W / 2, 948);

  ctx.strokeStyle = 'rgba(200,30,30,0.85)'; ctx.lineWidth = 4;

let previewRenderToken = 0;
/* ===== 預覽內容兩指縮放（PWA / 平板手勢無法使用瀏覽器縮放，改以 transform 自製） ===== */
const previewZoom = { scale: 1, tx: 0, ty: 0 };
function applyPreviewZoom() {
  const el = $('#file-preview-zoom'), body = $('#file-preview-body');
  if (!el) return;
  const { scale, tx, ty } = previewZoom;
  el.style.transform = (scale === 1 && !tx && !ty) ? '' : `translate(${tx}px, ${ty}px) scale(${scale})`;
  if (body) body.style.touchAction = scale > 1 ? 'none' : 'pan-x pan-y';
}
function resetPreviewZoom() {
  const body = $('#file-preview-body');
  if (body) { body.scrollTop = 0; body.scrollLeft = 0; }
  previewZoom.scale = 1; previewZoom.tx = 0; previewZoom.ty = 0;
  applyPreviewZoom();
}
function clampPreviewPan() {
  const body = $('#file-preview-body'), el = $('#file-preview-zoom');
  if (!body || !el) return;
  const s = previewZoom.scale;
  const minTx = Math.min(0, body.clientWidth - el.offsetWidth * s);
  const minTy = Math.min(0, body.clientHeight - el.offsetHeight * s);
  previewZoom.tx = Math.max(minTx, Math.min(0, previewZoom.tx));
  previewZoom.ty = Math.max(minTy, Math.min(0, previewZoom.ty));
}
function setupPreviewZoom() {
  const body = $('#file-preview-body');
  if (!body || body.dataset.zoomBound) return;
  body.dataset.zoomBound = '1';
  let mode = '', startDist = 1, startScale = 1, midX = 0, midY = 0, panX = 0, panY = 0;
  let rectLeft = 0, rectTop = 0;
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  body.addEventListener('touchstart', (e) => {
    if (e.touches.length >= 2) {
      const rect = body.getBoundingClientRect();
      rectLeft = rect.left; rectTop = rect.top;
      mode = 'pinch';
      startDist = dist(e.touches[0], e.touches[1]) || 1;
      startScale = previewZoom.scale;
      midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rectLeft;
      midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rectTop;
      /* 將目前原生捲動位移併入 transform，縮放時錨點才不會位移 */
      previewZoom.tx -= body.scrollLeft;
      previewZoom.ty -= body.scrollTop;
      body.scrollLeft = 0; body.scrollTop = 0;
      panX = previewZoom.tx; panY = previewZoom.ty;
    } else if (e.touches.length === 1 && previewZoom.scale > 1) {
      mode = 'pan';
      panX = e.touches[0].clientX - previewZoom.tx;
      panY = e.touches[0].clientY - previewZoom.ty;
    } else {
      mode = '';
    }
  }, { passive: true });
  body.addEventListener('touchmove', (e) => {
    if (mode === 'pinch' && e.touches.length >= 2) {
      e.preventDefault();
      const s = Math.max(1, Math.min(5, startScale * (dist(e.touches[0], e.touches[1]) / startDist)));
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rectLeft;
      const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rectTop;
      previewZoom.tx = cx - (midX - panX) / startScale * s;
      previewZoom.ty = cy - (midY - panY) / startScale * s;
      previewZoom.scale = s;
      clampPreviewPan(); applyPreviewZoom();
    } else if (mode === 'pan' && e.touches.length === 1 && previewZoom.scale > 1) {
      e.preventDefault();
      previewZoom.tx = e.touches[0].clientX - panX;
      previewZoom.ty = e.touches[0].clientY - panY;
      clampPreviewPan(); applyPreviewZoom();
    }
  }, { passive: false });
  body.addEventListener('touchend', (e) => {
    if (e.touches.length >= 2) { mode = 'pinch'; return; }
    if (e.touches.length === 1 && mode === 'pinch') {
      mode = 'pan';
      panX = e.touches[0].clientX - previewZoom.tx;
      panY = e.touches[0].clientY - previewZoom.ty;
      return;
    }
    mode = '';
    if (previewZoom.scale <= 1.02) resetPreviewZoom();
    else { clampPreviewPan(); applyPreviewZoom(); }
  }, { passive: true });
}

/* PDF 以 pdf.js 繪製為 Canvas，兼容平板／手機（iOS Safari、Android 無法內嵌 blob iframe） */
async function renderPdfPreview(body, content, blob, token) {
  const lib = window.pdfjsLib;
  if (!lib) throw new Error('預覽元件載入失敗');
  const pdf = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
  if (token !== previewRenderToken) return;
  const wrap = document.createElement('div');
  wrap.className = 'p-3 space-y-3 bg-slate-100';
  content.innerHTML = '';
  content.appendChild(wrap);
  const maxWidth = Math.max(240, (body.clientWidth || window.innerWidth) - 24);
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const base = page.getViewport({ scale: 1 });
    const viewport = page.getViewport({ scale: Math.min(2.5, maxWidth / base.width) });
    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    canvas.className = 'block mx-auto max-w-full h-auto bg-white rounded-lg shadow-sm';
    wrap.appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    if (token !== previewRenderToken) return;
  }
}
async function renderCourseFilePreview(body, content, blob, file, token) {

    if (!window.mammoth) { content.innerHTML = '<div class="h-64 grid place-items-center text-slate-400 text-sm">預覽元件載入失敗</div>'; return; }
    const { value } = await window.mammoth.convertToHtml({ arrayBuffer: await blob.arrayBuffer() });

    return;
  }
  if (file.ext === 'xls' || file.ext === 'xlsx') {
    if (!window.XLSX) { content.innerHTML = '<div class="h-64 grid place-items-center text-slate-400 text-sm">預覽元件載入失敗</div>'; return; }
    const wb = window.XLSX.read(new Uint8Array(await blob.arrayBuffer()), { type: 'array' });

      <div class="p-4 bg-white border-b border-slate-100">

    return;
  }
  content.innerHTML = '<div class="h-64 grid place-items-center text-center p-6"><div><p class="text-slate-600 font-semibold">此格式不支援線上預覽</p><p class="text-xs text-slate-400 mt-1">請下載後開啟</p></div></div>';
}

/* 更新幻燈片分頁圓點：依捲動位置算出目前頁碼 */
function updateActivityDots() {
  const list = $('#activity-student-list');
  const dots = $('#activity-dots');
  if (!list || !dots) return;
  const total = state.activities.length;
  if (!total) { dots.innerHTML = ''; return; }
  const center = list.scrollLeft + list.clientWidth / 2;
  let idx = 0, best = Infinity;
  Array.from(list.children).forEach((el, i) => {
    const c = el.offsetLeft + el.offsetWidth / 2;
    const d = Math.abs(c - center);
    if (d < best) { best = d; idx = i; }
  });
  dots.innerHTML = Array.from({ length: total }, (_, i) =>
    `<span class="w-2 h-2 rounded-full transition-colors ${i === idx ? 'bg-brand' : 'bg-slate-300'}"></span>`).join('');
}
/* 桌機（非觸控）：滑鼠按住左右拖曳切換幻燈片（觸控交給原生捲動） */
const _activityDrag = { el: null, active: false, startX: 0, startScroll: 0, moved: false };
let _activityDragInit = false;
function bindActivityDrag(list) {
  _activityDrag.el = list;
  _activityDrag.active = false;
  _activityDrag.moved = false;
  list.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch' || e.button !== 0) return;
    _activityDrag.active = true;
    _activityDrag.moved = false;
    _activityDrag.startX = e.clientX;
    _activityDrag.startScroll = list.scrollLeft;
  });
  // 拖曳後放開滑鼠時，避免誤觸卡片內的圖片或連結
  list.addEventListener('click', (e) => {
    if (_activityDrag.moved) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  if (_activityDragInit) return;
  _activityDragInit = true;
  window.addEventListener('pointermove', (e) => {
    const st = _activityDrag;
    if (!st.active || !st.el) return;
    const dx = e.clientX - st.startX;
    if (!st.moved && Math.abs(dx) < 5) return;
    st.moved = true;
    st.el.classList.add('dragging');
    st.el.scrollLeft = st.startScroll - dx;
  });
  const endDrag = () => {
    const st = _activityDrag;
    if (!st.active) return;
    st.active = false;
    if (st.el) st.el.classList.remove('dragging');
    if (st.moved) setTimeout(() => { st.moved = false; }, 0);
  };
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
}

/* ===== 圖片壓縮（置中裁切為正方形 JPEG） ===== */
function compressImage(file, maxSize = 256, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('讀取檔案失敗'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('圖片載入失敗'));
      img.onload = () => {
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        const canvas = document.createElement('canvas');
        canvas.width = maxSize; canvas.height = maxSize;
        canvas.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, maxSize, maxSize);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ===== Auth 狀態監聽 ===== */
onAuthStateChanged(auth, async (user) => {
  if (user) {
    state.currentUser = user;
    const cachedRole = localStorage.getItem('nw_role');
    let doc = { uid: user.uid, name: user.displayName || '學員', email: user.email || '', phone: '', unit: '', role: cachedRole || 'student' };
    let firestoreOk = false;
    try {
      const existing = await loadUserDoc(user.uid);
      if (existing) { doc = existing; firestoreOk = true; }
      else { await createUserDoc(user.uid, doc); firestoreOk = true; }
    } catch { console.warn('Firestore 讀取失敗，使用本機快取角色'); }
    if (!firestoreOk) {
      if (cachedRole) doc.role = cachedRole;
    } else {
      localStorage.setItem('nw_role', doc.role || 'student');
    }
    state.userDoc = doc;
    let role = doc.role || 'student';
    if ((user.email || '').toLowerCase() === 'istage.eason@gmail.com') role = 'admin';
    if (role !== doc.role) { doc.role = role; localStorage.setItem('nw_role', role); }
    if (role !== PAGE_ROLE && role !== 'admin') {
      window.location.href = REDIRECT_MAP[role] || 'index.html';
      return;
    }
    renderUser();
    applySystemName();
    showView('course-select');
  } else {
    state.currentUser = null; state.userDoc = null;
    state.activeCourse = null;
    state.courseCheckedIn = false; state.activeTabId = null;
    cleanupListener('unsubCheckins');
    cleanupListener('unsubCourseCheckin');
    cleanupCourseFileListeners();
    cleanupActivityListeners();
    cleanupExamListeners();
    $('#btn-user-chip').classList.add('hidden');
    $('#modal-profile').classList.add('hidden');
    showView('auth');
  }
});
