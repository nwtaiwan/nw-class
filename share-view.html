<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#d32f2f" />
<title>西北會議系統 · 分享清單</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { brand: { DEFAULT: '#d32f2f', dark: '#b71c1c', light: '#ef5350' } },
        fontFamily: { sans: ['-apple-system','BlinkMacSystemFont','Segoe UI','PingFang TC','Microsoft JhengHei','sans-serif'] },
      },
    },
  };
</script>

<link rel="icon" type="image/png" sizes="192x192" href="logo.png?v=2" />
<link rel="apple-touch-icon" href="logo.png?v=2" />

<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: #f1f5f9; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  #share-shell { height: 100vh; height: 100dvh; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  #landscape-lock { display: none; }
  @media (orientation: landscape) and (max-height: 540px) {
    #share-shell { filter: blur(2px); pointer-events: none; }
    #landscape-lock { display: flex !important; position: fixed; inset: 0; z-index: 9999; background: #0f172a; color: #fff; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
  }
</style>
</head>

<body class="font-sans text-slate-800">

<div id="landscape-lock" class="hidden">
  <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="#d32f2f" viewBox="0 0 24 24"><path d="M16.5 3h-9A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5v-13A2.5 2.5 0 0 0 16.5 3zM12 18a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg>
  <p class="text-lg font-semibold">請將手機轉為直屏</p>
</div>

<div id="share-shell" class="mx-auto w-full max-w-md bg-white flex flex-col overflow-hidden relative shadow-2xl">

  <!-- 上：系統 LOGO / 名稱 / 課程切換 -->
  <header class="h-[10dvh] shrink-0 flex items-center gap-2 px-3 bg-white border-b border-slate-200">
    <img src="logo.png" alt="NW Class" class="w-8 h-8 rounded-lg object-cover ring-1 ring-slate-200 shrink-0"
         onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23d32f2f%22/%3E%3Ctext x=%2232%22 y=%2242%22 font-size=%2226%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22%3ENW%3C/text%3E%3C/svg%3E';" />
    <span class="font-bold text-base text-slate-900 shrink-0">西北會議系統</span>
    <select id="course-filter" class="ml-auto min-w-0 max-w-[46%] h-9 px-2 text-sm border border-slate-300 rounded-lg bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand">
      <option value="">全部課程</option>
    </select>
  </header>

  <!-- 中：篩選（單位 / 社區 / 關鍵字） -->
  <div class="h-[10dvh] shrink-0 flex items-center gap-1.5 px-3 bg-white border-b border-slate-200">
    <select id="unit-filter" class="flex-1 min-w-0 w-full h-9 px-1.5 text-sm border border-slate-300 rounded-lg bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand">
      <option value="">全部單位</option>
    </select>
    <select id="community-filter" class="flex-1 min-w-0 w-full h-9 px-1.5 text-sm border border-slate-300 rounded-lg bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand">
      <option value="">全部社區</option>
    </select>
    <input id="kw-filter" type="search" placeholder="關鍵字" class="flex-1 min-w-0 w-full h-9 px-2 text-sm border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-brand" />
  </div>

  <!-- 下：學員清單 -->
  <main class="flex-1 min-h-0 overflow-y-auto no-scrollbar p-3">
    <div class="flex items-center justify-between px-1 pb-1.5">
      <p id="list-count" class="text-[11px] text-slate-400"></p>
      <label class="flex items-center gap-1 text-[11px] text-slate-500">
        <input id="select-all" type="checkbox" class="w-3.5 h-3.5 accent-brand" />全選
      </label>
    </div>
    <div id="list" class="space-y-2">
      <p class="text-slate-400 text-center py-6 text-sm">載入中…</p>
    </div>
  </main>

  <!-- 分享工具列（勾選 1 位＝單選，多位＝複選） -->
  <div id="share-bar" class="hidden shrink-0 border-t border-slate-200 bg-white px-3 py-2 flex items-center gap-2">
    <span id="share-count" class="flex-1 text-sm text-slate-600"></span>
    <button id="share-clear" class="px-3 py-2 text-sm rounded-lg border border-slate-300 text-slate-600 active:scale-95">取消</button>
    <button id="share-do" class="px-4 py-2 text-sm rounded-lg bg-brand text-white font-semibold active:scale-95">分享</button>
  </div>

</div>

<div id="toast" class="hidden fixed left-1/2 bottom-8 -translate-x-1/2 z-[120] max-w-[80vw] px-4 py-2 rounded-full bg-slate-900/90 text-white text-sm text-center"></div>

<!-- 分享選單 -->
<div id="share-sheet" class="hidden fixed inset-0 z-[130]">
  <div id="share-sheet-mask" class="absolute inset-0 bg-black/40"></div>
  <div class="absolute left-1/2 bottom-0 -translate-x-1/2 w-full max-w-md bg-white rounded-t-2xl p-3 space-y-2">
    <p class="text-center text-xs text-slate-400 pb-1">分享</p>
    <button id="share-line" class="w-full py-3 rounded-xl bg-[#06c755] text-white font-semibold active:scale-95">分享到 LINE</button>
    <button id="share-native" class="w-full py-3 rounded-xl border border-slate-300 text-slate-700 font-semibold active:scale-95">其他分享方式</button>
    <button id="share-copy" class="w-full py-3 rounded-xl border border-slate-300 text-slate-700 font-semibold active:scale-95">複製連結</button>
    <button id="share-sheet-cancel" class="w-full py-3 rounded-xl text-slate-500 font-semibold active:scale-95">取消</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD1QJxc-AFkS7RkbQOLCqk1LBMydCU067s",
  authDomain: "nw-class.firebaseapp.com",
  projectId: "nw-class",
  storageBucket: "nw-class.firebasestorage.app",
  messagingSenderId: "222147006846",
  appId: "1:222147006846:web:f197cc75aa51879967232f",
  measurementId: "G-0E1SRMQPRE"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const $ = (s) => document.querySelector(s);
const escHtml = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const digitsOf = (s) => String(s || '').replace(/\D/g, '');
const toast = (msg, ms = 2200) => {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), ms);
};
const initial = (name) => (name || 'N').trim().charAt(0).toUpperCase();

/* 分享頁面帶入的學員 uid 清單（?ids=uid1,uid2） */
const sharedIds = new Set(
  String(new URLSearchParams(location.search).get('ids') || '')
    .split(',').map((s) => s.trim()).filter(Boolean)
);

const state = {
  students: [], unitColorMap: {}, comCodeMap: {}, selected: new Set(), currentRows: [],
};

const courseSel = $('#course-filter');
const unitSel = $('#unit-filter');
const comSel = $('#community-filter');
const kwInput = $('#kw-filter');
const listEl = $('#list');
const countEl = $('#list-count');
const selectAllEl = $('#select-all');
const barEl = $('#share-bar');
const barCountEl = $('#share-count');

const uidOf = (s) => s.uid || s.id || '';

/* ===== 分享連結：導向學員登入頁並帶入帳號、密碼（每位學員皆為專屬連結） ===== */
function loginUrl(s) {
  const account = s.email || s.loginCode || s.phone || '';
  const password = s.password || digitsOf(s.phone);
  const u = new URL('index.html', location.href);
  u.searchParams.set('u', account);
  u.searchParams.set('p', password);
  return u.href;
}

/* ===== 分享：每位學員的內容與連結網址皆為專屬且獨一 ===== */
function shareMessage(s) {
  return `${s.name || '學員'} 您好，這是西北會議系統學員登入連結，這是您專屬連結，請勿分享給其他使用者，謝謝！`;
}
function studentPayload(s) {
  return { title: '西北會議系統', text: shareMessage(s), url: loginUrl(s) };
}
function selectedStudents() {
  return state.students.filter((s) => state.selected.has(uidOf(s)));
}
function selectedPayload(list) {
  const ids = list.map(uidOf).filter(Boolean);
  const u = new URL('share-view.html', location.href);
  u.searchParams.set('ids', ids.join(','));
  return {
    title: '西北會議系統 · 分享清單',
    text: `這是西北會議系統的學員登入資訊頁面（共 ${list.length} 位），請開啟連結查看。`,
    url: u.href,
  };
}
function shareStudent(s) { openShareSheet(studentPayload(s)); }
function shareSelected() {
  const list = selectedStudents();
  if (!list.length) { toast('請先勾選要分享的帳號'); return; }
  openShareSheet(list.length === 1 ? studentPayload(list[0]) : selectedPayload(list));
}

/* ===== 分享選單（LINE／系統分享／複製連結） ===== */
let pendingShare = null;
function openShareSheet(payload) {
  pendingShare = payload;
  $('#share-native').textContent = navigator.share ? '其他分享方式' : '複製連結';
  $('#share-sheet').classList.remove('hidden');
}
function closeShareSheet() {
  $('#share-sheet').classList.add('hidden');
  pendingShare = null;
}
function lineShareUrl(p) {
  // 聊天室內容＝訊息 + 連結網址，與系統分享文字一致
  const content = p.url ? `${p.text}\n${p.url}` : p.text;
  return 'https://social-plugins.line.me/lineit/share?text=' + encodeURIComponent(content);
}
async function copyShareLink(p) {
  try { await navigator.clipboard.writeText(`${p.text}\n${p.url}`); toast('已複製連結'); }
  catch { window.prompt('請複製以下連結：', p.url); }
}

/* ===== 勾選狀態同步 ===== */
function syncSelectionUI(rows) {
  const valid = new Set(state.students.map(uidOf).filter(Boolean));
  for (const id of Array.from(state.selected)) if (!valid.has(id)) state.selected.delete(id);
  const n = state.selected.size;
  barEl.classList.toggle('hidden', n === 0);
  barCountEl.textContent = `已選 ${n} 位`;
  const ids = (rows || []).map(uidOf).filter(Boolean);
  const sel = ids.filter((i) => state.selected.has(i)).length;
  selectAllEl.checked = ids.length > 0 && sel === ids.length;
  selectAllEl.indeterminate = sel > 0 && sel < ids.length;
}
function applyCheckboxState() {
  listEl.querySelectorAll('input[data-check]').forEach((cb) => {
    cb.checked = state.selected.has(cb.dataset.check);
  });
  syncSelectionUI(state.currentRows);
}

/* ===== 渲染清單 ===== */
function renderList() {
  const cid = courseSel.value;
  const un = unitSel.value;
  const com = comSel.value;
  const kw = kwInput.value.trim().toLowerCase();

  const rows = state.students.filter((s) => {
    if (cid && !(Array.isArray(s.courses) && s.courses.includes(cid))) return false;
    if (un && String(s.unit || '') !== un) return false;
    if (com && String(s.community || '') !== com) return false;
    if (kw) {
      const hay = [s.name, s.title, s.community, s.unit, s.email, s.loginCode, s.phone]
        .filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(kw)) return false;
    }
    return true;
  });

  const sortKey = (u) => {
    const code = state.comCodeMap[u.community];
    return code ? code : '\uffff' + (u.community || '');
  };
  rows.sort((a, b) =>
    String(sortKey(a)).localeCompare(String(sortKey(b)), 'zh-Hant', { numeric: true })
    || String(a.name || '').localeCompare(String(b.name || ''), 'zh-Hant'));

  countEl.textContent = rows.length ? `共 ${rows.length} 人` : '';
  state.currentRows = rows;
  if (!rows.length) {
    listEl.innerHTML = `<p class="text-slate-400 text-center py-6 text-sm">${sharedIds.size ? '沒有符合的學員' : '沒有可分享的學員'}</p>`;
    syncSelectionUI(rows);
    return;
  }
  listEl.innerHTML = rows.map((s) => {
    const uid = uidOf(s);
    const unitColor = state.unitColorMap[s.unit];
    const cardStyle = unitColor
      ? `border-color:${unitColor}; box-shadow: inset 0 0 0 1px ${unitColor}40, inset 0 0 14px ${unitColor}55`
      : '';
    const unitChip = s.unit
      ? `<span class="px-1.5 py-0.5 rounded-md text-[11px] font-semibold" style="color:${unitColor || '#475569'}; border:1px solid ${unitColor || '#cbd5e1'}">${escHtml(s.unit)}</span>`
      : '';
    const comChip = s.community
      ? `<span class="px-1.5 py-0.5 rounded-md text-[11px] font-semibold bg-slate-100 text-slate-600">${escHtml(s.community)}</span>`
      : '';
    const checked = state.selected.has(uid) ? ' checked' : '';
    return `
    <div class="bg-white border-2 border-slate-200 rounded-xl p-3 flex items-center gap-3"${cardStyle ? ` style="${cardStyle}"` : ''}>
      <input type="checkbox" data-check="${escHtml(uid)}" class="shrink-0 w-5 h-5 accent-brand"${checked} />
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-1.5 flex-wrap">${unitChip}${comChip}</div>
        <p class="mt-1 text-sm text-slate-500 truncate">${escHtml(s.title || '—')}</p>
        <p class="text-base font-semibold text-slate-900 truncate">${escHtml(s.name || '未命名')}</p>
      </div>
      <button data-share="${escHtml(uid)}" class="shrink-0 px-3 py-2 bg-brand text-white rounded-lg text-sm font-semibold active:scale-95">分享</button>
    </div>`;
  }).join('');
  syncSelectionUI(rows);
}

/* ===== 載入資料（公開讀取） ===== */
async function loadData() {
  try {
    const [userSnap, unitSnap, comSnap, courseSnap] = await Promise.all([
      getDocs(query(collection(db, 'users'), where('role', '==', 'student'))),
      getDocs(collection(db, 'units')),
      getDocs(collection(db, 'communities')),
      getDocs(collection(db, 'courses')),
    ]);

    unitSnap.docs.forEach((d) => {
      const u = d.data() || {};
      const name = String(u.name || '').trim();
      if (name && u.color) state.unitColorMap[name] = String(u.color).trim();
    });

    const communityOpts = comSnap.docs.map((d) => {
      const c = d.data() || {};
      const name = String(c.name || '').trim();
      const code = String(c.code || '').trim();
      if (name) state.comCodeMap[name] = code;
      return { name, code };
    }).filter((o) => o.name)
      .sort((a, b) => String(a.code).localeCompare(String(b.code), 'zh-Hant', { numeric: true }) || a.name.localeCompare(b.name, 'zh-Hant'));
    comSel.innerHTML = '<option value="">全部社區</option>' +
      communityOpts.map((o) => `<option value="${escHtml(o.name)}">${escHtml(o.code ? `${o.code} ${o.name}` : o.name)}</option>`).join('');

    const unitNames = Object.keys(state.unitColorMap)
      .concat(unitSnap.docs.map((d) => String((d.data() || {}).name || '').trim()))
      .filter(Boolean);
    const unitOpts = Array.from(new Set(unitNames)).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
    unitSel.innerHTML = '<option value="">全部單位</option>' +
      unitOpts.map((n) => `<option value="${escHtml(n)}">${escHtml(n)}</option>`).join('');

    const courses = courseSnap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .filter((c) => c.archived !== true)
      .sort((a, b) => String(a.date || '').localeCompare(String(b.date || ''))
        || String(a.name || '').localeCompare(String(b.name || ''), 'zh-Hant'));
    courseSel.innerHTML = '<option value="">全部課程</option>' +
      courses.map((c) => `<option value="${escHtml(c.id)}">${escHtml(c.name || '未命名課程')}</option>`).join('');

    // 只保留分享頁面帶入的學員
    state.students = userSnap.docs
      .map((d) => ({ id: d.id, ...d.data() }))
      .filter((s) => !sharedIds.size || sharedIds.has(uidOf(s)));
    renderList();
  } catch (err) {
    console.error('[share-view] load failed', err);
    listEl.innerHTML = `<p class="text-red-500 text-center py-6 text-sm">載入失敗：${escHtml(err.code || err.message || '')}</p>`;
  }
}

/* ===== 事件 ===== */
courseSel.addEventListener('change', renderList);
unitSel.addEventListener('change', renderList);
comSel.addEventListener('change', renderList);
kwInput.addEventListener('input', renderList);
listEl.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-share]');
  if (!btn) return;
  const s = state.students.find((x) => uidOf(x) === btn.dataset.share);
  if (s) shareStudent(s);
});
listEl.addEventListener('change', (e) => {
  const cb = e.target.closest('input[data-check]');
  if (!cb) return;
  if (cb.checked) state.selected.add(cb.dataset.check);
  else state.selected.delete(cb.dataset.check);
  syncSelectionUI(state.currentRows);
});
selectAllEl.addEventListener('change', () => {
  const ids = (state.currentRows || []).map(uidOf).filter(Boolean);
  if (selectAllEl.checked) ids.forEach((i) => state.selected.add(i));
  else ids.forEach((i) => state.selected.delete(i));
  applyCheckboxState();
});
$('#share-clear').addEventListener('click', () => {
  state.selected.clear();
  applyCheckboxState();
});
$('#share-do').addEventListener('click', shareSelected);

/* ===== 分享選單事件 ===== */
$('#share-sheet-mask').addEventListener('click', closeShareSheet);
$('#share-sheet-cancel').addEventListener('click', closeShareSheet);
$('#share-line').addEventListener('click', () => {
  if (!pendingShare) return;
  window.open(lineShareUrl(pendingShare), '_blank', 'noopener');
  closeShareSheet();
});
$('#share-native').addEventListener('click', async () => {
  const p = pendingShare;
  if (!p) return;
  if (navigator.share) {
    try { await navigator.share({ title: p.title, text: p.text, url: p.url }); }
    catch (err) { if (!(err && err.name === 'AbortError')) await copyShareLink(p); }
  } else {
    await copyShareLink(p);
  }
  closeShareSheet();
});
$('#share-copy').addEventListener('click', async () => {
  const p = pendingShare;
  if (!p) return;
  closeShareSheet();
  await copyShareLink(p);
});

loadData();
</script>

</body>
</html>
